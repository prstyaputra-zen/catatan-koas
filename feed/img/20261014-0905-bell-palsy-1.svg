<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" width="920" height="760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="920" height="760" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Bell's palsy: jalur nervus fasialis (N. VII) dan letak lesi</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik, tidak sesuai skala</text>
<text x="20" y="90" font-size="15" font-weight="700" fill="#111827" text-anchor="start">A. Perjalanan saraf dan cabangnya</text>
<rect x="170" y="150" width="520" height="80" rx="12" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
<text x="430" y="142" font-size="12" font-weight="700" fill="#57534e" text-anchor="middle">Kanal fasialis di tulang temporal (pars petrosa)</text>
<rect x="20" y="154" width="120" height="72" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="80" y="182" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Nukleus</text>
<text x="80" y="200" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">fasialis (pons)</text>
<line x1="140" y1="190" x2="790" y2="190" stroke="#ca8a04" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="250" cy="190" rx="38" ry="15" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5"/>
<text x="250" y="224" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Segmen labirintin:</text>
<text x="250" y="240" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle">bagian kanal tersempit,</text>
<text x="250" y="256" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle">saraf bengkak terjepit</text>
<text x="155" y="178" font-size="11.5" font-weight="700" fill="#374151" text-anchor="middle">MAI</text>
<circle cx="330" cy="190" r="11" fill="#fde047" stroke="#a16207" stroke-width="2"/>
<line x1="352" y1="190" x2="352" y2="290" stroke="#ca8a04" stroke-width="4"/>
<rect x="284" y="290" width="136" height="78" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="352" y="310" font-size="12" font-weight="700" fill="#713f12" text-anchor="middle">N. petrosus mayor</text>
<text x="352" y="330" font-size="11.5" font-weight="400" fill="#374151" text-anchor="middle">ke kelenjar lakrimal:</text>
<text x="352" y="347" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">mata kering</text>
<line x1="500" y1="190" x2="500" y2="290" stroke="#ca8a04" stroke-width="4"/>
<rect x="432" y="290" width="136" height="78" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="500" y="310" font-size="12" font-weight="700" fill="#713f12" text-anchor="middle">N. ke stapedius</text>
<text x="500" y="330" font-size="11.5" font-weight="400" fill="#374151" text-anchor="middle">redam suara keras:</text>
<text x="500" y="347" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">hiperakusis</text>
<line x1="648" y1="190" x2="648" y2="290" stroke="#ca8a04" stroke-width="4"/>
<rect x="580" y="290" width="136" height="78" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="648" y="310" font-size="12" font-weight="700" fill="#713f12" text-anchor="middle">Korda timpani</text>
<text x="648" y="330" font-size="11.5" font-weight="400" fill="#374151" text-anchor="middle">pengecapan 2/3 depan</text>
<text x="648" y="347" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">lidah, ludah</text>
<text x="330" y="170" font-size="11.5" font-weight="700" fill="#a16207" text-anchor="middle">G. genikulatum</text>
<text x="690" y="140" font-size="11.5" font-weight="700" fill="#374151" text-anchor="middle">Foramen</text>
<text x="690" y="154" font-size="11.5" font-weight="700" fill="#374151" text-anchor="middle">stilomastoid</text>
<line x1="690" y1="162" x2="690" y2="230" stroke="#57534e" stroke-width="2" stroke-dasharray="4,3"/>
<ellipse cx="820" cy="230" rx="70" ry="90" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/>
<text x="820" y="340" font-size="12" font-weight="700" fill="#3f6212" text-anchor="middle">Kelenjar parotis</text>
<line x1="790" y1="190" x2="842" y2="160" stroke="#ca8a04" stroke-width="3"/>
<text x="846" y="164" font-size="11" font-weight="700" fill="#3f6212" text-anchor="start">Temporal</text>
<line x1="790" y1="190" x2="842" y2="192" stroke="#ca8a04" stroke-width="3"/>
<text x="846" y="196" font-size="11" font-weight="700" fill="#3f6212" text-anchor="start">Zigomatik</text>
<line x1="790" y1="190" x2="842" y2="224" stroke="#ca8a04" stroke-width="3"/>
<text x="846" y="228" font-size="11" font-weight="700" fill="#3f6212" text-anchor="start">Bukal</text>
<line x1="790" y1="190" x2="842" y2="256" stroke="#ca8a04" stroke-width="3"/>
<text x="846" y="260" font-size="11" font-weight="700" fill="#3f6212" text-anchor="start">Marginal</text>
<line x1="790" y1="190" x2="842" y2="288" stroke="#ca8a04" stroke-width="3"/>
<text x="846" y="292" font-size="11" font-weight="700" fill="#3f6212" text-anchor="start">Servikal</text>
<text x="20" y="400" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Otot wajah satu sisi (5 cabang) lumpuh pada semua lesi di jalur ini. Gejala tambahan</text>
<text x="20" y="418" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">(mata kering, hiperakusis, pengecapan) muncul bila lesi berada sebelum cabang tersebut lepas.</text>
<text x="20" y="458" font-size="15" font-weight="700" fill="#111827" text-anchor="start">B. Dahi ikut lumpuh atau tidak?</text>
<circle cx="170" cy="580" r="95" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
<clipPath id="lo170"><rect x="170" y="550" width="100" height="130"/></clipPath>
<path d="M170,485 A95,95 0 0,1 170,675 Z" fill="#60a5fa" opacity="0.35" clip-path="url(#lo170)"/>
<path d="M110,530 q20,-12 40,0" fill="none" stroke="#111827" stroke-width="3"/>
<path d="M190,530 q20,-12 40,0" fill="none" stroke="#111827" stroke-width="3"/>
<line x1="115" y1="502" x2="155" y2="502" stroke="#9a3412" stroke-width="1.2"/>
<line x1="185" y1="502" x2="225" y2="502" stroke="#9a3412" stroke-width="1.2"/>
<line x1="115" y1="510" x2="155" y2="510" stroke="#9a3412" stroke-width="1.2"/>
<line x1="185" y1="510" x2="225" y2="510" stroke="#9a3412" stroke-width="1.2"/>
<line x1="115" y1="518" x2="155" y2="518" stroke="#9a3412" stroke-width="1.2"/>
<line x1="185" y1="518" x2="225" y2="518" stroke="#9a3412" stroke-width="1.2"/>
<ellipse cx="130" cy="555" rx="14" ry="5" fill="#111827"/>
<ellipse cx="210" cy="555" rx="14" ry="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<circle cx="210" cy="555" r="4" fill="#111827"/>
<path d="M120,618 q30,6 50,4 q25,4 45,14" fill="none" stroke="#111827" stroke-width="3"/>
<text x="170" y="702" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Lesi UMN (mis. stroke)</text>
<text x="170" y="721" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">dahi tetap bisa dikerutkan</text>
<circle cx="470" cy="580" r="95" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
<path d="M470,485 A95,95 0 0,1 470,675 Z" fill="#f87171" opacity="0.35"/>
<path d="M410,530 q20,-12 40,0" fill="none" stroke="#111827" stroke-width="3"/>
<path d="M490,538 q20,-2 40,0" fill="none" stroke="#111827" stroke-width="3"/>
<line x1="415" y1="502" x2="455" y2="502" stroke="#9a3412" stroke-width="1.2"/>
<line x1="415" y1="510" x2="455" y2="510" stroke="#9a3412" stroke-width="1.2"/>
<line x1="415" y1="518" x2="455" y2="518" stroke="#9a3412" stroke-width="1.2"/>
<ellipse cx="430" cy="555" rx="14" ry="5" fill="#111827"/>
<ellipse cx="510" cy="555" rx="14" ry="9" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<circle cx="510" cy="551" r="4" fill="#111827"/>
<path d="M420,618 q30,6 50,4 q25,4 45,14" fill="none" stroke="#111827" stroke-width="3"/>
<text x="470" y="702" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Lesi LMN (Bell's palsy)</text>
<text x="470" y="721" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">dahi ikut lumpuh, mata tak menutup</text>
<text x="610" y="500" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Mengapa berbeda?</text>
<text x="610" y="519" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Bagian nukleus untuk wajah atas</text>
<text x="610" y="538" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">mendapat persarafan dari KEDUA</text>
<text x="610" y="557" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">hemisfer; wajah bawah terutama</text>
<text x="610" y="576" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">dari hemisfer seberang.</text>
<text x="610" y="595" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="610" y="614" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Stroke merusak satu jalur atas:</text>
<text x="610" y="633" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">dahi masih dijaga hemisfer lain.</text>
<text x="610" y="652" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start"></text>
<text x="610" y="671" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Bell's palsy merusak saraf tepi</text>
<text x="610" y="690" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">itu sendiri: semua cabang satu</text>
<text x="610" y="709" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">sisi lumpuh, termasuk dahi.</text>
</svg>
