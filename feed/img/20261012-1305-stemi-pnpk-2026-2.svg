<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="900" height="640" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">IMA-EST: memilih strategi reperfusi</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik berdasarkan PNPK Tata Laksana Sindrom Koroner Akut 2026</text>
<rect x="220" y="70" width="460" height="104" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="234" y="95" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Kontak medis pertama (KMP)</text>
<text x="234" y="117" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">EKG 12 sandapan dibaca &lt; 10 menit</text>
<text x="234" y="136" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Elevasi ST persisten di 2 sandapan bersebelahan</text>
<text x="234" y="155" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">atau LBBB baru, dengan gejala ≤ 12 jam → reperfusi</text>
<line x1="330" y1="176" x2="200" y2="226" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="150" y="214" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">KMP→IKP &lt; 120 menit</text>
<line x1="570" y1="176" x2="700" y2="226" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="760" y="214" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">IKP &lt; 120 menit tidak mungkin</text>
<rect x="20" y="230" width="380" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="34" y="255" font-size="15" font-weight="700" fill="#111827" text-anchor="start">IKP primer</text>
<text x="34" y="277" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Antiplatelet ganda: aspirin + ticagrelor</text>
<text x="34" y="296" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">atau prasugrel (klopidogrel bila tidak ada)</text>
<text x="34" y="315" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Antikoagulan selama prosedur</text>
<text x="34" y="334" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">(enoksaparin lebih dipilih daripada UFH)</text>
<rect x="480" y="230" width="400" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="494" y="255" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Fibrinolitik dalam 30 menit dari KMP</text>
<text x="494" y="277" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Utamakan agen spesifik fibrin</text>
<text x="494" y="296" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">(tenekteplase, alteplase) &gt; streptokinase</text>
<text x="494" y="315" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Tenekteplase: ½ dosis bila usia ≥ 75 tahun</text>
<text x="494" y="334" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Tambah aspirin + klopidogrel + antikoagulan</text>
<line x1="680" y1="352" x2="680" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="480" y="402" width="400" height="74" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="494" y="427" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Nilai 60-90 menit setelah fibrinolitik</text>
<text x="494" y="449" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Resolusi ST ≥ 50% dan klinis stabil?</text>
<line x1="560" y1="478" x2="470" y2="520" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="500" y="506" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Tidak</text>
<line x1="800" y1="478" x2="800" y2="520" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<text x="818" y="504" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Ya</text>
<rect x="220" y="524" width="360" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="234" y="549" font-size="15" font-weight="700" fill="#111827" text-anchor="start">IKP penyelamatan (rescue) segera</text>
<text x="234" y="571" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Juga bila hemodinamik/listrik tidak stabil,</text>
<text x="234" y="590" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">iskemia memburuk, atau nyeri menetap</text>
<rect x="600" y="524" width="280" height="86" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="614" y="549" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Angiografi ± IKP</text>
<text x="614" y="571" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">dalam 2-24 jam setelah</text>
<text x="614" y="590" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">fibrinolisis berhasil</text>
<text x="20" y="632" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Sumber: Kemenkes RI, PNPK Tata Laksana Sindrom Koroner Akut (KMK HK.01.07/MENKES/876/2026).</text>
</svg>
