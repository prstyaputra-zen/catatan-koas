<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="900" height="660" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Toksisitas sistemik anestesi lokal (LAST)</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik. Kiri: urutan gejala saat kadar obat naik (kualitatif, tanpa skala). Kanan: regimen lipid.</text>
<rect x="30" y="92" width="340" height="74" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="44" y="116" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Awal (SSP)</text>
<text x="44" y="137" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Kepala ringan, baal sekitar mulut,</text>
<text x="44" y="155" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">gangguan lihat/dengar</text>
<rect x="48" y="184" width="340" height="74" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="62" y="208" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Eksitasi SSP</text>
<text x="62" y="229" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Gelisah, agitasi, kedutan otot,</text>
<text x="62" y="247" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">kejang tonik-klonik</text>
<rect x="66" y="276" width="340" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="80" y="300" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Depresi SSP</text>
<text x="80" y="321" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Penurunan kesadaran, koma,</text>
<text x="80" y="339" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">henti napas</text>
<rect x="84" y="368" width="340" height="74" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
<text x="98" y="392" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Kardiovaskular</text>
<text x="98" y="413" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Bradikardia, blok konduksi,</text>
<text x="98" y="431" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">aritmia ventrikel, asistol</text>
<line x1="20" y1="96" x2="20" y2="446" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<text x="14" y="470" font-size="12.5" font-weight="700" fill="#4b5563" text-anchor="start">Kadar obat dalam darah naik (makin ke bawah makin berat)</text>
<text x="30" y="498" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Gejala bisa muncul beberapa saat setelah injeksi.</text>
<text x="30" y="518" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Henti jantung karena bupivakain lebih sulit diresusitasi.</text>
<rect x="20" y="540" width="400" height="86" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="32" y="562" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Dosis maksimal (dewasa 70 kg, infiltrasi/blok):</text>
<text x="32" y="584" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Lidokain 300 mg · lidokain + epinefrin 500 mg</text>
<text x="32" y="604" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Bupivakain 225 mg (Update in Anaesthesia)</text>
<rect x="450" y="78" width="430" height="106" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="464" y="102" font-size="15" font-weight="700" fill="#111827" text-anchor="start">1. Hentikan dan amankan</text>
<text x="464" y="124" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Stop injeksi (ingat pompa infus) · panggil bantuan</text>
<text x="464" y="143" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">O₂ 100%, ventilasi adekuat, hindari hiperkarbia</text>
<text x="464" y="162" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Pastikan akses IV · siapkan troli henti jantung</text>
<line x1="665" y1="186" x2="665" y2="204" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="450" y="206" width="430" height="126" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="464" y="230" font-size="15" font-weight="700" fill="#111827" text-anchor="start">2. Emulsi lipid 20% (bukan propofol)</text>
<text x="464" y="252" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Bolus 1,5 mL/kgBB IV dalam 2-3 menit</text>
<text x="464" y="271" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Lalu infus 15 mL/kgBB/jam</text>
<text x="464" y="290" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Menit 5 dan 10: ulang bolus bila sirkulasi</text>
<text x="464" y="309" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">belum pulih; infus boleh digandakan 30 mL/kgBB/jam</text>
<line x1="665" y1="334" x2="665" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="450" y="354" width="430" height="66" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="464" y="378" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Batas</text>
<text x="464" y="400" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Maks. kumulatif 12 mL/kgBB (70 kg: 840 mL)</text>
<line x1="665" y1="422" x2="665" y2="440" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="450" y="442" width="430" height="106" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="464" y="466" font-size="15" font-weight="700" fill="#111827" text-anchor="start">3. Henti jantung: RJP terus</text>
<text x="464" y="488" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Epinefrin dosis kecil ≤ 1 µg/kgBB (bukan 1 mg)</text>
<text x="464" y="507" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Hindari vasopresin</text>
<text x="464" y="526" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Pemulihan bisa &gt; 1 jam</text>
<rect x="450" y="560" width="430" height="66" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="464" y="584" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Kejang</text>
<text x="464" y="606" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Benzodiazepin dosis kecil bertahap (pilihan utama)</text>
<text x="20" y="650" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Sumber: Association of Anaesthetists QRH 3-10 Local anaesthetic toxicity v2 (2023); Rajan N, Update in Anaesthesia.</text>
</svg>
