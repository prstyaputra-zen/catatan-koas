<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="640" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Dosis janin pemeriksaan radiologi vs ambang efek</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik · sumbu mendatar logaritmik (tiap garis = 10 kali lipat) · dosis rata-rata, mGy</text>
<rect x="763" y="80" width="75" height="320" fill="#fef3c7"/>
<rect x="838" y="80" width="32" height="320" fill="#fee2e2"/>
<line x1="230" y1="80" x2="230" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="230.0" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">0,001</text>
<line x1="337" y1="80" x2="337" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="336.66666666666663" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">0,01</text>
<line x1="443" y1="80" x2="443" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="443.3333333333333" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">0,1</text>
<line x1="550" y1="80" x2="550" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="550.0" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">1</text>
<line x1="657" y1="80" x2="657" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="656.6666666666666" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">10</text>
<line x1="763" y1="80" x2="763" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="763.3333333333334" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">100</text>
<line x1="870" y1="80" x2="870" y2="400" stroke="#e5e7eb" stroke-width="1"/>
<text x="870.0" y="418" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">1.000</text>
<text x="550.0" y="438" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Dosis janin (mGy)</text>
<text x="220" y="118" font-size="13.5" font-weight="700" fill="#111827" text-anchor="end">Foto toraks</text>
<rect x="230" y="98" width="107" height="30" rx="4" fill="#2563eb"/>
<text x="344.66666666666663" y="118" font-size="13" font-weight="700" fill="#111827" text-anchor="start">&lt; 0,01</text>
<text x="220" y="168" font-size="13.5" font-weight="700" fill="#111827" text-anchor="end">CT kepala</text>
<rect x="230" y="148" width="75" height="30" rx="4" fill="#2563eb"/>
<text x="312.55680046250865" y="168" font-size="13" font-weight="700" fill="#111827" text-anchor="start">&lt; 0,005</text>
<text x="220" y="218" font-size="13.5" font-weight="700" fill="#111827" text-anchor="end">CT toraks</text>
<rect x="230" y="198" width="190" height="30" rx="4" fill="#2563eb"/>
<text x="427.66946670758864" y="218" font-size="13" font-weight="700" fill="#111827" text-anchor="start">0,06</text>
<text x="220" y="268" font-size="13.5" font-weight="700" fill="#111827" text-anchor="end">Foto polos abdomen</text>
<rect x="230" y="248" width="336" height="30" rx="4" fill="#0891b2"/>
<text x="573.5869904723454" y="268" font-size="13" font-weight="700" fill="#111827" text-anchor="start">1,4</text>
<text x="220" y="318" font-size="13.5" font-weight="700" fill="#111827" text-anchor="end">CT abdomen</text>
<rect x="230" y="298" width="416" height="30" rx="4" fill="#0891b2"/>
<text x="654.329598612474" y="318" font-size="13" font-weight="700" fill="#111827" text-anchor="start">8</text>
<text x="220" y="368" font-size="13.5" font-weight="700" fill="#111827" text-anchor="end">CT pelvis</text>
<rect x="230" y="348" width="469" height="30" rx="4" fill="#7c3aed"/>
<text x="707.1136009250173" y="368" font-size="13" font-weight="700" fill="#111827" text-anchor="start">25</text>
<line x1="763" y1="80" x2="763" y2="400" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="838" y1="80" x2="838" y2="400" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="759.3333333333334" y="94" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="end">100 mGy</text>
<text x="841.890133795842" y="94" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="start">500 mGy</text>
<rect x="20" y="470" width="860" height="132" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="34" y="494" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Arti ambang (CDC 2025; ICRP 84 dikutip IAEA)</text>
<text x="34" y="516" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">&lt; 100 mGy (&lt; 0,1 Gy): efek nonkanker tidak terdeteksi; terminasi kehamilan TIDAK dibenarkan atas dasar risiko radiasi.</text>
<text x="34" y="536" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">100-500 mGy: kemungkinan hambatan pertumbuhan pada minggu 3-13 pascakonsepsi; keputusan sesuai kondisi individu.</text>
<text x="34" y="556" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">&gt; 500 mGy: risiko keguguran, malformasi berat, hambatan pertumbuhan meningkat; disabilitas intelektual berat mungkin</text>
<text x="34" y="574" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">(paling rentan minggu 8-15). Dosis radiologi diagnostik tipikal jauh di bawah 100 mGy (CDC).</text>
<text x="20" y="628" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">Sumber: IAEA, Radiation protection of pregnant women in radiology (data Sharp dkk. 1998); CDC, Radiation and Pregnancy: Information for Clinicians (2025).</text>
</svg>
