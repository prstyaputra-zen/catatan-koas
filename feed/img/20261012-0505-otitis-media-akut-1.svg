<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="900" height="660" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Otitis media akut: mengapa anak lebih sering terkena</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik, tidak sesuai skala</text>
<rect x="14" y="70" width="420" height="570" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<rect x="30" y="162" width="90" height="34" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="75" y="154" font-size="12" font-weight="400" fill="#92400e" text-anchor="middle">Liang telinga</text>
<line x1="120" y1="147" x2="120" y2="212" stroke="#7c3aed" stroke-width="4"/>
<text x="120" y="232" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">Membran timpani</text>
<rect x="122" y="137" width="86" height="84" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="165" y="130" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Telinga tengah</text>
<circle cx="138" cy="174" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<circle cx="160" cy="164" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<circle cx="182" cy="176" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<text x="165" y="204" font-size="11" font-weight="400" fill="#374151" text-anchor="middle">osikel</text>
<line x1="190" y1="221" x2="280" y2="236" stroke="#f97316" stroke-width="13" stroke-linecap="round"/>
<ellipse cx="302" cy="242" rx="42" ry="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="302" y="247" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Nasofaring</text>
<text x="30" y="100" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Anak</text>
<text x="30" y="312" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Tuba lebih pendek, lebih datar (horizontal),</text>
<text x="30" y="330" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">dan lebih lebar: sekret dan kuman dari</text>
<text x="30" y="348" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">nasofaring mudah naik ke telinga tengah;</text>
<text x="30" y="366" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">drainase dari telinga tengah juga kurang baik.</text>
<rect x="30" y="450" width="90" height="34" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="75" y="442" font-size="12" font-weight="400" fill="#92400e" text-anchor="middle">Liang telinga</text>
<line x1="120" y1="435" x2="120" y2="500" stroke="#7c3aed" stroke-width="4"/>
<text x="120" y="520" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">Membran timpani</text>
<rect x="122" y="425" width="86" height="84" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="165" y="418" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Telinga tengah</text>
<circle cx="138" cy="462" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<circle cx="160" cy="452" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<circle cx="182" cy="464" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
<text x="165" y="492" font-size="11" font-weight="400" fill="#374151" text-anchor="middle">osikel</text>
<line x1="190" y1="509" x2="330" y2="606" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="352" cy="612" rx="42" ry="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="352" y="617" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">Nasofaring</text>
<text x="30" y="388" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Dewasa</text>
<text x="225" y="405" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Tuba lebih panjang dan miring:</text>
<text x="225" y="423" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">drainase lebih baik,</text>
<text x="225" y="441" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">refluks lebih sulit.</text>
<text x="30" y="294" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="start">Tuba Eustachius (oranye): ventilasi, drainase, proteksi</text>
<text x="460" y="74" font-size="1" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<rect x="460" y="78" width="420" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="474" y="103" font-size="15" font-weight="700" fill="#111827" text-anchor="start">ISPA virus / alergi</text>
<text x="474" y="125" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Mukosa nasofaring dan tuba edema</text>
<line x1="670.0" y1="141" x2="670.0" y2="156" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="158" width="420" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="474" y="183" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Tuba tersumbat</text>
<text x="474" y="205" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Udara telinga tengah diserap, tekanan negatif</text>
<line x1="670.0" y1="221" x2="670.0" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="238" width="420" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="474" y="263" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Efusi telinga tengah</text>
<text x="474" y="285" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Cairan tertarik keluar dari mukosa</text>
<line x1="670.0" y1="301" x2="670.0" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="318" width="420" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="474" y="343" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Infeksi bakteri</text>
<text x="474" y="365" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">S. pneumoniae, H. influenzae, M. catarrhalis</text>
<line x1="670.0" y1="381" x2="670.0" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="398" width="420" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="474" y="423" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Pus menumpuk</text>
<text x="474" y="445" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Membran timpani menonjol (bulging), nyeri, demam</text>
<line x1="670.0" y1="461" x2="670.0" y2="476" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="478" width="420" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="474" y="503" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Perforasi</text>
<text x="474" y="525" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Pus keluar (otorea), nyeri biasanya berkurang</text>
<text x="460" y="572" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Diagnosis OMA (AAFP 2019): bulging sedang-berat atau otorea</text>
<text x="460" y="590" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">baru (bukan otitis eksterna); atau bulging ringan + nyeri</text>
<text x="460" y="608" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">telinga &lt; 48 jam atau eritema membran timpani yang hebat.</text>
<text x="20" y="652" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Sumber: Gaddey HL, et al. Am Fam Physician 2019;100(6):350-356. Anatomi tuba: konsep buku ajar standar.</text>
</svg>
