<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="372" fill="#ffffff"/><text x="450" y="32" font-size="19" font-weight="bold" fill="#1a2433" text-anchor="middle">Kriteria diagnosis DM tipe 2 (PNPK Kemenkes 2026)</text><rect x="30" y="50" width="280" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="38" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Pemeriksaan</text><rect x="310" y="50" width="200" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="318" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Diabetes</text><rect x="510" y="50" width="180" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="518" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Prediabetes</text><rect x="690" y="50" width="180" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="698" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Normal</text><rect x="30" y="86" width="280" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">HbA1c (%)</text><rect x="310" y="86" width="200" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="318" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">≥ 6,5</text><rect x="510" y="86" width="180" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="518" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">5,7-6,4</text><rect x="690" y="86" width="180" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="698" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">&lt; 5,7</text><rect x="30" y="122" width="280" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Glukosa plasma puasa (mg/dL)</text><rect x="310" y="122" width="200" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="318" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">≥ 126</text><rect x="510" y="122" width="180" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="518" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">100-125</text><rect x="690" y="122" width="180" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="698" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">70-99</text><rect x="30" y="158" width="280" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Glukosa 2 jam TTGO 75 g (mg/dL)</text><rect x="310" y="158" width="200" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="318" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">≥ 200</text><rect x="510" y="158" width="180" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="518" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">140-199</text><rect x="690" y="158" width="180" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="698" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">70-139</text><rect x="30" y="194" width="280" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Glukosa sewaktu (mg/dL)</text><rect x="310" y="194" width="200" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="318" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">≥ 200 + gejala klasik</text><rect x="510" y="194" width="180" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="518" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">-</text><rect x="690" y="194" width="180" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="698" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">-</text><rect x="30" y="248" width="840" height="108" rx="8" fill="#eef5f9" stroke="#9fb3c8" stroke-width="1.5"/><text x="46" y="274" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Glukosa sewaktu ≥ 200 mg/dL tanpa gejala klasik: perlu dua kali pemeriksaan pada hari yang sama.</text><text x="46" y="296" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Rawat inap (ADA 2026): mulai insulin bila hiperglikemia menetap ≥ 180 mg/dL;</text><text x="46" y="318" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">target 140-180 mg/dL untuk sebagian besar pasien. Hipoglikemia: &lt; 70 mg/dL (PNPK 2026).</text><text x="46" y="340" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Glukosuria saja tidak boleh dipakai untuk diagnosis.</text></svg>
