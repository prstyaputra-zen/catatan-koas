<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 960" width="920" height="960" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="920" height="960" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Nyeri punggung bawah: anatomi, tanda bahaya, dan alur awal</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik sederhana, tidak sesuai skala anatomi</text>
<text x="20" y="88" font-size="15" font-weight="700" fill="#111827" text-anchor="start">A. Ruas lumbal, diskus, dan penekanan akar saraf</text>
<rect x="20" y="104" width="880" height="290" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/>
<rect x="120" y="124" width="150" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="195" y="158" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Ruas lumbal 1</text>
<rect x="120" y="214" width="150" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="195" y="248" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Ruas lumbal 2</text>
<rect x="120" y="304" width="150" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="195" y="338" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Ruas berikutnya</text>
<rect x="120" y="180" width="150" height="34" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="195" y="202" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">Diskus</text>
<rect x="120" y="270" width="150" height="34" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="195" y="292" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">Diskus</text>
<ellipse cx="288" cy="287" rx="26" ry="14" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5"/>
<text x="120" y="384" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">Diskus menonjol menekan akar</text>
<rect x="320" y="124" width="26" height="236" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="333" y="116" font-size="12.5" font-weight="700" fill="#134e4a" text-anchor="middle">Kanal</text>
<path d="M346 280 C380 280 396 300 430 320" stroke="#0f766e" stroke-width="5" fill="none"/>
<text x="330" y="384" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">Akar saraf tertekan: nyeri tungkai, lemah, refleks turun</text>
<text x="500" y="138" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Letak nyeri menurut akar (AFP 2012)</text>
<text x="500" y="166" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">L1-L3</text>
<text x="500" y="184" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">menjalar ke pinggul dan atau paha</text>
<text x="500" y="204" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">L4-S1</text>
<text x="500" y="222" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">menjalar sampai di bawah lutut</text>
<text x="500" y="242" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">SLR positif &lt; lutut</text>
<text x="500" y="260" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">mengarah ke radikulopati L4-S1</text>
<text x="500" y="280" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Reverse SLR (paha depan)</text>
<text x="500" y="298" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">mengarah ke akar L3</text>
<text x="500" y="330" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Struktur tulang belakang jarang menimbulkan</text>
<text x="500" y="348" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">nyeri alih di bawah lutut.</text>
<text x="20" y="432" font-size="15" font-weight="700" fill="#111827" text-anchor="start">B. Tanda bahaya (mnemonik KIFS, tanda kuat dari AFP 2012)</text>
<rect x="20" y="450" width="208" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="124" y="476" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">K  Kanker</text>
<text x="124" y="502" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">Kanker menyebar ke tulang;</text>
<text x="124" y="520" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">berat badan turun tanpa sebab</text>
<rect x="242" y="450" width="208" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="346" y="476" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">I  Infeksi</text>
<text x="346" y="502" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">Demam, ISK, luka di tulang</text>
<text x="346" y="520" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">belakang, operasi lumbal baru</text>
<rect x="464" y="450" width="208" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="568" y="476" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">F  Fraktur</text>
<text x="568" y="502" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">Trauma bermakna untuk usia;</text>
<text x="568" y="520" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">osteoporosis, steroid lama</text>
<rect x="686" y="450" width="208" height="96" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
<text x="790" y="476" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">S  Sindrom kauda ekuina</text>
<text x="790" y="502" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">Retensi/inkontinensia, anestesi</text>
<text x="790" y="520" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">pelana, defisit memburuk</text>
<text x="20" y="570" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Tanda kuat: periksa lanjut segera, curigai rujukan. Kauda ekuina dan infeksi: rujuk segera. Tanda lemah atau sedang: boleh diamati 4-6 minggu.</text>
<text x="20" y="610" font-size="15" font-weight="700" fill="#111827" text-anchor="start">C. Alur awal LBP</text>
<rect x="20" y="628" width="880" height="56" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="36" y="652" font-size="14" font-weight="700" fill="#312e81" text-anchor="start">Anamnesis dan periksa neurologis tungkai: ada tanda bahaya atau defisit saraf berat/progresif?</text>
<text x="36" y="672" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Pencitraan rutin tidak diperlukan bila tidak ada tanda penyakit serius (ACP 2007; NICE NG59).</text>
<line x1="240" y1="686" x2="240" y2="712" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="690" y1="686" x2="690" y2="712" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="252" y="704" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Ya</text>
<text x="702" y="704" font-size="13" font-weight="700" fill="#166534" text-anchor="start">Tidak (nonspesifik)</text>
<rect x="20" y="714" width="430" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="36" y="740" font-size="14.5" font-weight="700" fill="#7f1d1d" text-anchor="start">Pemeriksaan lanjut dan rujukan</text>
<text x="36" y="764" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">MRI lebih disukai; CT bila MRI tidak bisa.</text>
<text x="36" y="786" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Laboratorium: darah lengkap, LED, CRP bila</text>
<text x="36" y="808" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">dicurigai infeksi atau keganasan.</text>
<text x="36" y="830" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Rujuk ke subspesialis tulang belakang.</text>
<rect x="470" y="714" width="430" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="486" y="740" font-size="14.5" font-weight="700" fill="#14532d" text-anchor="start">Terapi awal</text>
<text x="486" y="764" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Edukasi: biasanya membaik dalam sebulan.</text>
<text x="486" y="784" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Tetap aktif, jangan tirah baring; panas.</text>
<text x="486" y="804" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">NSAID dosis terendah, waktu tersingkat.</text>
<text x="486" y="824" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Hindari steroid sistemik, benzodiazepin, opioid.</text>
<text x="486" y="844" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Nilai ulang 2-4 minggu; rujuk bila berat/menetap.</text>
<text x="20" y="900" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Dasar: AFP 2008, 2012, 2024, 2025; ACP 2007 dan 2017; NICE NG59 (2016); WHO. Anatomi diskus dan kanal dari buku ajar.</text>
<text x="20" y="920" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Singkatan: ISK = infeksi saluran kemih; SLR = straight leg raise (uji angkat tungkai lurus).</text>
</svg>