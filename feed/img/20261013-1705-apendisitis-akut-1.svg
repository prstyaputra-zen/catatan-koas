<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="920" height="700" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Apendisitis akut: dari sumbatan lumen sampai perforasi</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik, tidak sesuai skala. Tampak depan: sisi kanan pasien ada di kiri gambar.</text>
<rect x="14" y="70" width="420" height="614" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="30" y="96" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Anatomi kuadran kanan bawah</text>
<path d="M120,110 L120,280 Q120,350 175,355 Q235,355 240,295 L240,110" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="180" y="135" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Kolon</text>
<text x="180" y="151" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">asendens</text>
<text x="180" y="330" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">Sekum</text>
<path d="M410,240 Q320,255 240,285" fill="none" stroke="#f472b6" stroke-width="18" stroke-linecap="round"/>
<text x="408" y="228" font-size="12" font-weight="700" fill="#be185d" text-anchor="end">Ileum terminal</text>
<path d="M205,352 Q235,250 210,190" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-dasharray="3,7" opacity="0.9"/>
<text x="214" y="182" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">retrosekal</text>
<path d="M205,352 Q190,405 170,440" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-dasharray="3,7" opacity="0.9"/>
<text x="120" y="462" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">subsekal</text>
<path d="M210,352 Q300,370 330,420" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-dasharray="3,7" opacity="0.9"/>
<text x="290" y="442" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">pelvis (ke panggul)</text>
<path d="M215,350 Q280,320 320,300" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-dasharray="3,7" opacity="0.9"/>
<text x="326" y="312" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">pre/postileal</text>
<text x="30" y="590" font-size="12" font-weight="400" fill="#15803d" text-anchor="start">Hijau putus-putus: kemungkinan posisi ujung apendiks.</text>
<text x="30" y="607" font-size="12" font-weight="400" fill="#15803d" text-anchor="start">Retrosekal paling sering; pangkalnya tetap di</text>
<text x="30" y="624" font-size="12" font-weight="400" fill="#15803d" text-anchor="start">ujung sekum, tempat ketiga taenia coli bertemu.</text>
<line x1="372" y1="132" x2="60" y2="330" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
<circle cx="372" cy="132" r="9" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="372" y="116" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Umbilikus (T10)</text>
<circle cx="60" cy="330" r="7" fill="#111827"/>
<text x="64" y="356" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">SIAS</text>
<circle cx="164" cy="264" r="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
<line x1="70" y1="512" x2="158.0" y2="274.0" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah)"/>
<text x="30" y="530" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">Titik McBurney (merah): 2/3 jarak dari umbilikus</text>
<text x="30" y="547" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">ke SIAS kanan, pada garis spinoumbilikal</text>
<text x="30" y="652" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">Nyeri awal samar di sekitar umbilikus (viseral, T10),</text>
<text x="30" y="669" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">lalu menetap di kanan bawah (peritoneum parietal).</text>
<rect x="452" y="78" width="452" height="74" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="466" y="107" font-size="15" font-weight="700" fill="#111827" text-anchor="start">1. Lumen tersumbat</text>
<text x="466" y="131" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Fekalit/apendikolit, hiperplasia limfoid, tumor</text>
<line x1="678.0" y1="153" x2="678.0" y2="172" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="452" y="174" width="452" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="466" y="203" font-size="15" font-weight="700" fill="#111827" text-anchor="start">2. Tekanan lumen naik</text>
<text x="466" y="227" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Mukus terus diproduksi, apendiks meregang</text>
<line x1="678.0" y1="249" x2="678.0" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="452" y="270" width="452" height="74" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="466" y="299" font-size="15" font-weight="700" fill="#111827" text-anchor="start">3. Aliran vena &amp; limfe macet</text>
<text x="466" y="323" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Dinding edema; nyeri viseral periumbilikal</text>
<line x1="678.0" y1="345" x2="678.0" y2="364" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="452" y="366" width="452" height="74" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="466" y="395" font-size="15" font-weight="700" fill="#111827" text-anchor="start">4. Iskemia + bakteri tumbuh</text>
<text x="466" y="419" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Aerob, lalu campuran aerob-anaerob</text>
<line x1="678.0" y1="441" x2="678.0" y2="460" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="452" y="462" width="452" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="466" y="491" font-size="15" font-weight="700" fill="#111827" text-anchor="start">5. Radang menembus dinding</text>
<text x="466" y="515" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Peritoneum parietal teriritasi: nyeri lokal</text>
<line x1="678.0" y1="537" x2="678.0" y2="556" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="452" y="558" width="452" height="74" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<text x="466" y="587" font-size="15" font-weight="700" fill="#111827" text-anchor="start">6. Gangren dan perforasi</text>
<text x="466" y="611" font-size="13" font-weight="400" fill="#374151" text-anchor="start">Abses lokal atau peritonitis difus, sepsis</text>
<text x="452" y="676" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="start">Makin lama tanpa tindakan, makin besar risiko perforasi.</text>
</svg>
