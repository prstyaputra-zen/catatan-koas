<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" width="920" height="760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="920" height="760" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Kejang demam: mekanisme, klasifikasi, dan alur penanganan</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik. Dosis mengikuti RCH Melbourne (2025); sesuaikan dengan protokol rumah sakit.</text>
<text x="20" y="88" font-size="15" font-weight="700" fill="#111827" text-anchor="start">A. Mengapa anak kecil kejang saat demam</text>
<rect x="20" y="100" width="200" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="32" y="124" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Demam ≥ 38 °C</text>
<text x="32" y="143" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">sering infeksi virus</text>
<text x="32" y="162" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">(mis. HHV-6, influenza A)</text>
<rect x="20" y="204" width="200" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="32" y="228" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Otak belum matang</text>
<text x="32" y="247" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">usia 6 bulan–5 tahun</text>
<rect x="20" y="288" width="200" height="72" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="32" y="312" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Bakat genetik</text>
<text x="32" y="331" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">riwayat keluarga</text>
<line x1="222" y1="146" x2="282" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<line x1="222" y1="240" x2="282" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<line x1="222" y1="324" x2="282" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="286" y="184" width="190" height="92" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="298" y="208" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Neuron mudah</text>
<text x="298" y="227" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">terangsang</text>
<text x="298" y="246" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">ambang kejang turun</text>
<line x1="478" y1="230" x2="520" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="524" y="184" width="160" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="536" y="208" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Lepas muatan</text>
<text x="536" y="227" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">listrik serentak</text>
<text x="536" y="246" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">= kejang umum</text>
<rect x="700" y="100" width="204" height="260" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="712" y="124" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="start">Bukan kejang demam bila:</text>
<text x="716" y="150" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">• infeksi SSP (meningitis,</text>
<text x="716" y="169" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">  ensefalitis)</text>
<text x="716" y="188" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">• gangguan elektrolit,</text>
<text x="716" y="207" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">  hipoglikemia, zat/obat</text>
<text x="716" y="226" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">• pernah kejang tanpa</text>
<text x="716" y="245" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">  demam sebelumnya</text>
<text x="712" y="286" font-size="12.5" font-weight="700" fill="#374151" text-anchor="start">Umumnya jinak:</text>
<text x="712" y="305" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">kebanyakan anak tanpa</text>
<text x="712" y="324" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">gangguan saraf jangka</text>
<text x="712" y="343" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">panjang.</text>
<text x="20" y="384" font-size="15" font-weight="700" fill="#111827" text-anchor="start">B. Sederhana atau kompleks</text>
<rect x="20" y="396" width="430" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="32" y="420" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Sederhana: SEMUA syarat</text>
<text x="32" y="439" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">• kejang umum (tonik-klonik)</text>
<text x="32" y="458" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">• &lt; 15 menit, pulih penuh &lt; 1 jam</text>
<text x="32" y="477" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">• tidak berulang dalam penyakit/24 jam yang sama</text>
<rect x="470" y="396" width="434" height="112" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="482" y="420" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Kompleks: SALAH SATU</text>
<text x="482" y="439" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">• fokal (satu sisi/satu bagian tubuh)</text>
<text x="482" y="458" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">• ≥ 15 menit atau sadar lama terganggu</text>
<text x="482" y="477" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">• berulang dalam 24 jam/penyakit yang sama</text>
<text x="20" y="532" font-size="15" font-weight="700" fill="#111827" text-anchor="start">C. Saat anak kejang</text>
<rect x="20" y="546" width="202" height="120" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="32" y="572" font-size="15" font-weight="700" fill="#111827" text-anchor="start">0 menit</text>
<text x="32" y="596" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Miringkan, amankan,</text>
<text x="32" y="616" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">jangan isi mulut,</text>
<text x="32" y="636" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">catat jam mulai</text>
<line x1="224" y1="606" x2="244" y2="606" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="246" y="546" width="202" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="258" y="572" font-size="15" font-weight="700" fill="#111827" text-anchor="start">&gt; 5 menit</text>
<text x="258" y="596" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Benzodiazepin ke-1:</text>
<text x="258" y="616" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">midazolam bukal/IN</text>
<text x="258" y="636" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">0,3 mg/kg (maks 10 mg)</text>
<line x1="450" y1="606" x2="470" y2="606" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="472" y="546" width="202" height="120" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="484" y="572" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Masih kejang</text>
<text x="484" y="596" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Benzodiazepin ke-2</text>
<text x="484" y="616" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">(maksimal 2 dosis</text>
<text x="484" y="636" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">termasuk pra-RS)</text>
<line x1="676" y1="606" x2="696" y2="606" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
<rect x="698" y="546" width="202" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="710" y="572" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Masih kejang</text>
<text x="710" y="596" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Lini kedua IV/IO:</text>
<text x="710" y="616" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">levetirasetam 40–60 mg/kg</text>
<text x="710" y="636" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">atau fenitoin 20 mg/kg</text>
<text x="20" y="698" font-size="12.5" font-weight="400" fill="#1d4ed8" text-anchor="start">Midazolam IV/IM/IO 0,15 mg/kg atau diazepam IV/IO 0,3 mg/kg (maks 10 mg) bila jalur tersedia.</text>
<text x="20" y="720" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="start">Antipiretik membuat anak nyaman, tetapi tidak mencegah kejang berulang.</text>
</svg>
