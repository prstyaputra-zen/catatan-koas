<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2b4a6b"/></marker></defs><text x="450" y="30" font-size="19" font-weight="bold" fill="#1a2433" text-anchor="middle">Skor Wells dan alur diagnosis DVT</text><rect x="30" y="46" width="360" height="30" fill="#1f6f8b" stroke="#9fb3c8"/><text x="38" y="66.0" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="start">Kriteria Wells DVT</text><rect x="390" y="46" width="60" height="30" fill="#1f6f8b" stroke="#9fb3c8"/><text x="398" y="66.0" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="start">Poin</text><rect x="30" y="76" width="360" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="96.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Kanker aktif</text><rect x="390" y="76" width="60" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="398" y="96.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="106" width="360" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="126.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Paralisis, paresis, atau gips tungkai baru</text><rect x="390" y="106" width="60" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="398" y="126.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="136" width="360" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="156.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Tirah baring ≥ 3 hari atau operasi besar baru</text><rect x="390" y="136" width="60" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="398" y="156.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="166" width="360" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="186.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Nyeri tekan lokal sepanjang vena dalam</text><rect x="390" y="166" width="60" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="398" y="186.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="196" width="360" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="216.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Seluruh tungkai bengkak</text><rect x="390" y="196" width="60" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="398" y="216.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="226" width="360" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="246.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Betis bengkak &gt; 3 cm dibanding sisi lain</text><rect x="390" y="226" width="60" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="398" y="246.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="256" width="360" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="276.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Edema pitting pada tungkai simtomatik</text><rect x="390" y="256" width="60" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="398" y="276.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="286" width="360" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="306.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Vena kolateral superfisial (bukan varises)</text><rect x="390" y="286" width="60" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="398" y="306.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="316" width="360" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="38" y="336.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Riwayat DVT terdokumentasi</text><rect x="390" y="316" width="60" height="30" fill="#eef5f9" stroke="#9fb3c8"/><text x="398" y="336.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">+1</text><rect x="30" y="346" width="360" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="38" y="366.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Diagnosis lain sama mungkin atau lebih mungkin</text><rect x="390" y="346" width="60" height="30" fill="#ffffff" stroke="#9fb3c8"/><text x="398" y="366.0" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">−2</text><rect x="480" y="56" width="390" height="40" rx="8" fill="#eef5f9" stroke="#2b4a6b" stroke-width="1.5"/><text x="675" y="81" font-size="13.5" font-weight="bold" fill="#1a2433" text-anchor="middle">Hitung skor Wells (rentang −2 sampai 9)</text><line x1="580" y1="96" x2="580" y2="124" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><line x1="770" y1="96" x2="770" y2="124" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><rect x="480" y="126" width="185" height="44" rx="8" fill="#e8f6ec" stroke="#2b4a6b" stroke-width="1.5"/><text x="572" y="153" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="middle">≤ 1: unlikely</text><rect x="685" y="126" width="185" height="44" rx="8" fill="#fdecea" stroke="#2b4a6b" stroke-width="1.5"/><text x="777" y="153" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="middle">≥ 2: likely</text><line x1="572" y1="170" x2="572" y2="196" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><line x1="777" y1="170" x2="777" y2="288" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><rect x="480" y="198" width="185" height="40" rx="8" fill="#ffffff" stroke="#2b4a6b" stroke-width="1.5"/><text x="572" y="223" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="middle">Periksa D-dimer</text><line x1="530" y1="238" x2="530" y2="262" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><line x1="620" y1="238" x2="710" y2="288" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><rect x="470" y="264" width="140" height="50" rx="8" fill="#e8f6ec" stroke="#2b4a6b" stroke-width="1.5"/><text x="540" y="284" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="middle">Normal:</text><text x="540" y="301" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="middle">DVT disingkirkan</text><rect x="640" y="290" width="230" height="44" rx="8" fill="#fff4dd" stroke="#2b4a6b" stroke-width="1.5"/><text x="755" y="317" font-size="13.5" font-weight="bold" fill="#1a2433" text-anchor="middle">USG kompresi (CUS)</text><text x="676" y="250" font-size="12" font-weight="normal" fill="#a3281c" text-anchor="start">Meningkat</text><text x="480" y="368" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Tungkai bengkak dan merah unilateral bisa</text><text x="480" y="386" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">selulitis ATAU DVT; keduanya dapat bersamaan.</text><text x="480" y="404" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Bila selulitis lebih mungkin, Wells mendapat −2.</text></svg>
