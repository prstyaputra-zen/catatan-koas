<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0284c7"/></marker>
  <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/></marker>
</defs>
<rect width="900" height="880" fill="#ffffff"/>
<rect x="15" y="12" width="870" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="30" y="36" font-size="16.5" font-weight="700" fill="#0f172a">Trauma Kimia Mata: Patofisiologi Asam vs Basa, Klasifikasi Roper-Hall, &amp; Alur Resusitasi</text>
<text x="30" y="55" font-size="12" fill="#475569">Mekanisme saponifikasi vs koagulasi, stratifikasi iskemia limbus, jendela emas irigasi, dan prevensi pelelehan stroma</text>
<rect x="15" y="78" width="425" height="248" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<rect x="15" y="78" width="425" height="30" rx="8" fill="#fee2e2"/>
<text x="28" y="98" font-size="13" font-weight="700" fill="#991b1b">A. Trauma Basa / Alkali (Nekrosis Likuefaktif - Lebih Destruktif)</text>
<text x="28" y="126" font-size="11.5" font-weight="700" fill="#7f1d1d">Bahan Umum:</text>
<text x="125" y="126" font-size="11" fill="#334155">Amonia (pembersih/pupuk), NaOH/soda api, kapur tohor / semen [Ca(OH)2].</text>
<text x="28" y="164" font-size="11.5" font-weight="700" fill="#7f1d1d">Mekanisme:</text>
<text x="125" y="164" font-size="11" fill="#334155">Saponifikasi asam lemak membran sel + denaturasi proteoglikan stroma.</text>
<text x="28" y="202" font-size="11.5" font-weight="700" fill="#7f1d1d">Penetrasi:</text>
<text x="125" y="202" font-size="11" fill="#334155">Sangat cepat (hitungan menit) menembus stroma kornea masuk ke bilik depan.</text>
<text x="28" y="240" font-size="11.5" font-weight="700" fill="#7f1d1d">Dampak Limbus:</text>
<text x="125" y="240" font-size="11" fill="#334155">Iskemia limbus berat &amp; nekrosis sel punca limbus (LSCD) → konjungtivalisasi.</text>
<text x="28" y="278" font-size="11.5" font-weight="700" fill="#7f1d1d">Bahaya Lambat:</text>
<text x="125" y="278" font-size="11" fill="#334155">Pelelehan stroma (corneal melting), ulkus steril, glaukoma sekunder, katarak.</text>
<rect x="460" y="78" width="425" height="248" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="460" y="78" width="425" height="30" rx="8" fill="#dbeafe"/>
<text x="473" y="98" font-size="13" font-weight="700" fill="#1e40af">B. Trauma Asam (Nekrosis Koagulatif - Efek Barier Protein)</text>
<text x="473" y="126" font-size="11.5" font-weight="700" fill="#1e3a8a">Bahan Umum:</text>
<text x="568" y="126" font-size="11" fill="#334155">Asam sulfat (air aki mobil/motor), asam klorida (pembersih keramik), asam cuka.</text>
<text x="473" y="164" font-size="11.5" font-weight="700" fill="#1e3a8a">Mekanisme:</text>
<text x="568" y="164" font-size="11" fill="#334155">Koagulasi dan presipitasi protein epitel kornea → terbentuk barier koagulum.</text>
<text x="473" y="202" font-size="11.5" font-weight="700" fill="#1e3a8a">Penetrasi:</text>
<text x="568" y="202" font-size="11" fill="#334155">Cenderung superfisial dan lambat karena terhalang koagulasi protein anterior.</text>
<text x="473" y="240" font-size="11.5" font-weight="700" fill="#1e3a8a">Pengecualian:</text>
<text x="568" y="240" font-size="11" fill="#334155">Asam hidrofluorat (HF): ion F- bebas tembus sangat cepat &amp; berikatan Ca2+.</text>
<text x="473" y="278" font-size="11.5" font-weight="700" fill="#1e3a8a">Gambaran Khas:</text>
<text x="568" y="278" font-size="11" fill="#334155">Ground-glass appearance superfisial kornea; prognosis umum lebih baik.</text>
<rect x="15" y="336" width="870" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="15" y="336" width="870" height="30" rx="8" fill="#f1f5f9"/>
<text x="28" y="356" font-size="13" font-weight="700" fill="#0f172a">C. Klasifikasi Keparahan Roper-Hall (Berdasarkan Kejernihan Kornea &amp; Iskemia Limbus)</text>
<rect x="25" y="376" width="205" height="138" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="35" y="396" font-size="12" font-weight="700" fill="#15803d">Derajat I (Ringan)</text>
<line x1="35" y1="402" x2="220" y2="402" stroke="#86efac" stroke-width="1"/>
<text x="35" y="420" font-size="11" font-weight="700" fill="#0f172a">Kornea Jernih</text>
<text x="35" y="436" font-size="10.5" fill="#334155">Hanya defek epitel</text>
<text x="35" y="460" font-size="10.5" font-weight="700" fill="#1e293b">Iskemia Limbus: 0</text>
<text x="35" y="480" font-size="10" fill="#475569">Sistem Dua: ukur jam &amp; %</text>
<text x="35" y="500" font-size="10.5" font-weight="700" fill="#15803d">Prognosis: Sangat Baik</text>
<rect x="242" y="376" width="205" height="138" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.2"/>
<text x="252" y="396" font-size="12" font-weight="700" fill="#0369a1">Derajat II (Sedang)</text>
<line x1="252" y1="402" x2="437" y2="402" stroke="#7dd3fc" stroke-width="1"/>
<text x="252" y="420" font-size="11" font-weight="700" fill="#0f172a">Kornea Berkabut</text>
<text x="252" y="436" font-size="10.5" fill="#334155">Detail iris terlihat jelas</text>
<text x="252" y="460" font-size="10.5" font-weight="700" fill="#1e293b">Iskemia: &lt; 1/3 (&lt; 4 jam)</text>
<text x="252" y="480" font-size="10" fill="#475569">Sistem Dua: ukur jam &amp; %</text>
<text x="252" y="500" font-size="10.5" font-weight="700" fill="#0369a1">Prognosis: Baik</text>
<rect x="459" y="376" width="205" height="138" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.2"/>
<text x="469" y="396" font-size="12" font-weight="700" fill="#b45309">Derajat III (Berat)</text>
<line x1="469" y1="402" x2="654" y2="402" stroke="#fde68a" stroke-width="1"/>
<text x="469" y="420" font-size="11" font-weight="700" fill="#0f172a">Kornea Sangat Keruh</text>
<text x="469" y="436" font-size="10.5" fill="#334155">Detail iris terhalang/samar</text>
<text x="469" y="460" font-size="10.5" font-weight="700" fill="#1e293b">Iskemia: 1/3 - 1/2 (4-6 jam)</text>
<text x="469" y="480" font-size="10" fill="#475569">Sistem Dua: ukur jam &amp; %</text>
<text x="469" y="500" font-size="10.5" font-weight="700" fill="#b45309">Prognosis: Meragukan</text>
<rect x="676" y="376" width="205" height="138" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="686" y="396" font-size="12" font-weight="700" fill="#b91c1c">Derajat IV (Sangat Berat)</text>
<line x1="686" y1="402" x2="871" y2="402" stroke="#fca5a5" stroke-width="1"/>
<text x="686" y="420" font-size="11" font-weight="700" fill="#0f172a">Kornea Putih Porselen</text>
<text x="686" y="436" font-size="10.5" fill="#334155">Opak total (marble cornea)</text>
<text x="686" y="460" font-size="10.5" font-weight="700" fill="#1e293b">Iskemia: &gt; 1/2 (&gt; 6 jam)</text>
<text x="686" y="480" font-size="10" fill="#475569">Sistem Dua: ukur jam &amp; %</text>
<text x="686" y="500" font-size="10.5" font-weight="700" fill="#b91c1c">Prognosis: Sangat Buruk</text>
<rect x="15" y="536" width="425" height="332" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<rect x="15" y="536" width="425" height="30" rx="8" fill="#dcfce7"/>
<text x="28" y="556" font-size="13" font-weight="700" fill="#15803d">D. Protokol Resusitasi Darurat di IGD / FKTP</text>
<rect x="25" y="586" width="405" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="35" y="604" font-size="11" font-weight="700" fill="#166534">1. Irigasi Segera (Nomor 1!):</text>
<text x="35" y="620" font-size="10" fill="#334155">Guyur cairan mengalir (NaCl 0,9% / Ringer Laktat) 1-2 L kontinu selama 15-30 menit. Jangan tunda untuk visus!</text>
<rect x="25" y="640" width="405" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="35" y="658" font-size="11" font-weight="700" fill="#166534">2. Anestesi Topikal:</text>
<text x="35" y="674" font-size="10" fill="#334155">Tetrakain 0,5% / pantokain 0,5% 1-2 tetes agar blefarospasme reda dan forniks konjungtiva dapat terbuka lebar.</text>
<rect x="25" y="694" width="405" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="35" y="712" font-size="11" font-weight="700" fill="#166534">3. Eversi &amp; Bersihkan Forniks:</text>
<text x="35" y="728" font-size="10" fill="#334155">Balik kelopak mata atas/bawah; bersihkan sisa partikel semen/kapur tohor memakai lidi kapas steril basah.</text>
<rect x="25" y="748" width="405" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="35" y="766" font-size="11" font-weight="700" fill="#166534">4. Pantau pH Forniks:</text>
<text x="35" y="782" font-size="10" fill="#334155">Gunakan strip lakmus/pH 5 menit pascairigasi di forniks inferior. Target netral: pH 7,0 - 7,4 (ulang irigasi bila belum).</text>
<rect x="25" y="802" width="405" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="35" y="820" font-size="11" font-weight="700" fill="#166534">5. Pantau TIO &amp; Kerusakan:</text>
<text x="35" y="836" font-size="10" fill="#334155">Waspadai lonjakan TIO (kontraksi sklera/kolagen) dan nilai luas pemutihan/iskemia limbus.</text>
<rect x="460" y="536" width="425" height="332" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<rect x="460" y="536" width="425" height="30" rx="8" fill="#fef3c7"/>
<text x="473" y="556" font-size="13" font-weight="700" fill="#b45309">E. Farmakoterapi Fase Akut &amp; Rujukan Cito</text>
<rect x="470" y="574" width="405" height="42" rx="5" fill="#ffffff" stroke="#fef08a" stroke-width="1"/>
<text x="480" y="590" font-size="11" font-weight="700" fill="#92400e">Re-epitelisasi &amp; Lubrikasi:</text>
<text x="480" y="605" font-size="9.8" fill="#334155">Air mata buatan tanpa pengawet (tiap jam) + salep kloramfenikol 1% 4x/hari untuk proteksi defek epitel.</text>
<rect x="470" y="620" width="405" height="42" rx="5" fill="#ffffff" stroke="#fef08a" stroke-width="1"/>
<text x="480" y="636" font-size="11" font-weight="700" fill="#92400e">Redakan Spasme Siliaris:</text>
<text x="480" y="651" font-size="9.8" fill="#334155">Sikloplegik (siklopentolat 1% / atropin 1% 2-3x/hari) untuk atasi fotofobia hebat &amp; cegah sinekia posterior.</text>
<rect x="470" y="666" width="405" height="42" rx="5" fill="#ffffff" stroke="#fef08a" stroke-width="1"/>
<text x="480" y="682" font-size="11" font-weight="700" fill="#92400e">Dukung Sintesis Kolagen:</text>
<text x="480" y="697" font-size="9.8" fill="#334155">Vitamin C (asam askorbat) oral 1.000-2.000 mg/hari + tetes 10% tiap jam: kofaktor hidroksilasi kolagen stroma.</text>
<rect x="470" y="712" width="405" height="42" rx="5" fill="#ffffff" stroke="#fef08a" stroke-width="1"/>
<text x="480" y="728" font-size="11" font-weight="700" fill="#92400e">Cegah 'Corneal Melting':</text>
<text x="480" y="743" font-size="9.8" fill="#334155">Doksisiklin 100 mg 2x/hari oral: inhibisi enzim kolagenase (MMP-8/9) guna cegah penipisan/perforasi kornea.</text>
<rect x="470" y="758" width="405" height="42" rx="5" fill="#ffffff" stroke="#fef08a" stroke-width="1"/>
<text x="480" y="774" font-size="11" font-weight="700" fill="#92400e">Kortikosteroid Terkontrol:</text>
<text x="480" y="789" font-size="9.8" fill="#334155">Prednisolon asetat 1% 4-6x/hari HANYA hari 1-7 (tekan PMN). Wajib stop/taper hari 7-10 cegah lisis stroma!</text>
<rect x="470" y="804" width="405" height="42" rx="5" fill="#ffffff" stroke="#fef08a" stroke-width="1"/>
<text x="480" y="820" font-size="11" font-weight="700" fill="#92400e">Kriteria Rujukan Cito Sp.M:</text>
<text x="480" y="835" font-size="9.8" fill="#334155">Segera setelah irigasi bila: Roper-Hall II-IV, iskemia limbus &gt; 0, TIO tinggi, partikel tertanam, atau alkali kuat.</text>
</svg>