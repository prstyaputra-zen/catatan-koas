<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 930" width="920" height="930" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="920" height="930" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">PPOK: mengapa udara masuk mudah tetapi sulit keluar</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik sederhana, tidak sesuai skala anatomi</text>
<text x="20" y="88" font-size="15" font-weight="700" fill="#111827" text-anchor="start">A. Saluran napas kecil dan alveolus</text>
<rect x="20" y="104" width="430" height="300" rx="12" fill="#f7fdf9" stroke="#d1d5db" stroke-width="1.5"/>
<text x="235" y="130" font-size="14.5" font-weight="700" fill="#15803d" text-anchor="middle">Normal</text>
<rect x="50" y="150" width="150" height="56" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="125" y="234" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">saluran napas kecil terbuka</text>
<circle cx="310" cy="195" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="370" cy="195" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="280" cy="250" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="340" cy="250" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="400" cy="250" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="310" cy="305" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="370" cy="305" r="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="235" y="372" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">recoil elastik baik: udara keluar dengan lancar</text>
<text x="235" y="392" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">FEV1/FVC normal</text>
<rect x="470" y="104" width="430" height="300" rx="12" fill="#fff7f7" stroke="#d1d5db" stroke-width="1.5"/>
<text x="685" y="130" font-size="14.5" font-weight="700" fill="#b91c1c" text-anchor="middle">PPOK</text>
<rect x="500" y="178" width="150" height="26" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<rect x="500" y="156" width="150" height="22" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
<rect x="500" y="204" width="150" height="22" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
<text x="575" y="244" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">dinding menebal, mukus</text>
<text x="575" y="260" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">jalan udara menyempit</text>
<ellipse cx="790" cy="250" rx="90" ry="72" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5"/>
<text x="790" y="246" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">alveolus rusak</text>
<text x="790" y="264" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">menyatu (emfisema)</text>
<text x="790" y="342" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">udara terperangkap</text>
<text x="685" y="372" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">recoil elastik hilang: udara sulit keluar</text>
<text x="685" y="392" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">paru hiperinflasi, sesak, FEV1/FVC turun</text>
<text x="20" y="440" font-size="15" font-weight="700" fill="#111827" text-anchor="start">B. Rantai patofisiologi</text>
<rect x="20" y="456" width="165" height="78" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="102.5" y="492.0" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Asap rokok,</text>
<text x="102.5" y="508.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">biomassa, polusi</text>
<rect x="195" y="456" width="165" height="78" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="277.5" y="492.0" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Inflamasi kronik,</text>
<text x="277.5" y="508.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">stres oksidatif</text>
<rect x="370" y="456" width="165" height="78" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="452.5" y="484.0" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Emfisema +</text>
<text x="452.5" y="500.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">saluran napas</text>
<text x="452.5" y="516.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">kecil menyempit</text>
<rect x="545" y="456" width="165" height="78" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="627.5" y="484.0" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Air trapping,</text>
<text x="627.5" y="500.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">hiperinflasi,</text>
<text x="627.5" y="516.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">V/Q tidak seimbang</text>
<rect x="720" y="456" width="165" height="78" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="802.5" y="484.0" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Sesak, hipoksemia,</text>
<text x="802.5" y="500.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">hiperkapnia,</text>
<text x="802.5" y="516.0" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">kor pulmonale</text>
<line x1="185" y1="495" x2="193" y2="495" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="360" y1="495" x2="368" y2="495" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="535" y1="495" x2="543" y2="495" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="710" y1="495" x2="718" y2="495" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="20" y="556" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Penyumbat utama obstruksi ringan-sedang: saluran napas kecil (&lt;2 mm). Eksaserbasi dicetuskan terutama infeksi (virus ±70-80%).</text>
<text x="20" y="600" font-size="15" font-weight="700" fill="#111827" text-anchor="start">C. Eksaserbasi akut (dosis rujukan StatPearls 2026; PNPK 2019 tidak memuat dosis steroid dan antibiotik)</text>
<rect x="20" y="618" width="430" height="232" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="235" y="648" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Rawat jalan (ringan)</text>
<text x="36" y="686" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• SABA ditingkatkan (± SAMA)</text>
<text x="36" y="714" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• Prednison 40 mg oral/hari selama 5 hari</text>
<text x="36" y="742" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• Antibiotik 5-7 hari bila dahak purulen</text>
<text x="48" y="770" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">dan sesak atau volume dahak naik</text>
<text x="36" y="798" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• Evaluasi tanda gagal napas</text>
<rect x="470" y="618" width="430" height="232" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="685" y="648" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Rawat inap (sedang-berat)</text>
<text x="486" y="686" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• Target SpO2 88-92% (sungkup Venturi)</text>
<text x="486" y="714" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• Albuterol + ipratropium nebulisasi</text>
<text x="486" y="742" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• Metilprednisolon 40-80 mg IV tiap 8-12 jam</text>
<text x="498" y="770" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">atau prednison 40 mg oral 5 hari</text>
<text x="486" y="798" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">• NIV bila pH &lt;7,35 atau PaCO2 &gt;45 mmHg</text>
<text x="20" y="880" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Hindari oksigen 100% saat nebulisasi pada hipoksemia kronik (PNPK 2019).</text>
<text x="20" y="912" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Dasar: PNPK PPOK (KMK 687/2019) dan StatPearls COPD (2026). Model gambar saluran napas dari buku ajar fisiologi pernapasan.</text>
</svg>