<text x="20" y="652" font-size="13" fill="#374151">Lengan 9% tiap sisi. Perineum 1%. Total 100%. Telapak + jari tangan pasien ≈ 1% TBSA (luka kecil/tersebar).</text>
<text x="20" y="672" font-size="13" fill="#374151">Anak: setiap tahun setelah usia 12 bulan, kepala −1% dan tiap tungkai +0,5% (PNPK Luka Bakar 2019).</text>
<text x="20" y="690" font-size="12" fill="#6b7280">Hitung hanya luka bakar derajat dua (dermal) dan tiga (full thickness) untuk resusitasi cairan.</text>
</svg>
