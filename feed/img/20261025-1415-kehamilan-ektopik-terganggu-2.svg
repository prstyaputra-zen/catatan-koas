<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="620" fill="#ffffff"/>
  
  <!-- Header -->
  <rect x="20" y="15" width="840" height="52" rx="8" fill="#1e3a8a"/>
  <text x="440" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">ALGORITMA EVALUASI &amp; TATALAKSANA KEHAMILAN EKTOPIK</text>
  <text x="440" y="56" font-size="13" text-anchor="middle" fill="#bfdbfe">Berdasarkan Konsensus NICE NG126 (2026), AAFP (2020), dan Pedoman Emergensi Obstetri POGI</text>

  <!-- Step 1: Presentation Box -->
  <rect x="180" y="80" width="520" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="101" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Wanita Usia Reproduksi + Tes Kehamilan Urin (hCG) Positif</text>
  <text x="440" y="120" font-size="13" text-anchor="middle" fill="#334155">Disertai nyeri perut/panggul bawah dan/atau perdarahan pervaginam abnormal</text>

  <!-- Split arrows -->
  <path d="M 320 130 L 320 160 L 220 160 L 220 175" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 560 130 L 560 160 L 640 160 L 640 175" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Left: Hemodynamically Unstable (KET) -->
  <rect x="40" y="180" width="360" height="95" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="202" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">HEMODINAMIK TIDAK STABIL / RUDIRAGA</text>
  <text x="55" y="224" font-size="13" fill="#b91c1c">• Syok hipovolemik (TD sistolik &lt; 90 mmHg, Nadi &gt; 100x/m)</text>
  <text x="55" y="244" font-size="13" fill="#b91c1c">• Nyeri goyang porsio hebat, defans muskular / abdomen akut</text>
  <text x="55" y="264" font-size="13" fill="#b91c1c">• Cairan bebas luas / tanda Kehr (+) &#8594; Kehamilan Ektopik Terganggu</text>

  <path d="M 220 275 L 220 305" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="40" y="310" width="360" height="145" rx="6" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="220" y="333" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">RESUSITASI DARURAT &amp; BEDAH CITO</text>
  <text x="55" y="358" font-size="13" fill="#fee2e2">1. Resusitasi Sirkulasi Segera:</text>
  <text x="70" y="376" font-size="13" fill="#ffffff">• 2 jalur IV kanul besar (16G / 18G) + bolus RL/NaCl 0,9%</text>
  <text x="70" y="394" font-size="13" fill="#ffffff">• O2 sungkup 10-15 L/m + pasang kateter urin (target &#8805;0,5 mL/kg/j)</text>
  <text x="70" y="412" font-size="13" fill="#ffffff">• Ambil sampel darah cito: Crossmatch PRC &amp; profil koagulasi</text>
  <text x="55" y="432" font-size="13" font-weight="bold" fill="#fef08a">2. LAPAROTOMI CITO / LAPAROSKOPI DARURAT</text>
  <text x="70" y="448" font-size="13" fill="#fef08a">&#8594; Salpingektomi total untuk hemostasis definitif</text>

  <!-- Right: Hemodynamically Stable -->
  <rect x="460" y="180" width="380" height="95" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="650" y="202" font-size="15" font-weight="bold" text-anchor="middle" fill="#0369a1">HEMODINAMIK STABIL</text>
  <text x="475" y="224" font-size="13" fill="#0284c7">• Tanda vital stabil, tidak ada tanda peritonitis umum</text>
  <text x="475" y="244" font-size="13" fill="#0284c7">• Lakukan USG Transvaginal (TVUS) + Serum &#946;-hCG Kuantitatif</text>
  <text x="475" y="264" font-size="13" fill="#0284c7">• Evaluasi: Massa adneksa terpisah ovarium, sliding sign, tubal ring</text>

  <!-- Flow below TVUS -->
  <path d="M 650 275 L 650 305" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="460" y="310" width="380" height="52" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="650" y="331" font-size="14" font-weight="bold" text-anchor="middle" fill="#0369a1">Stratifikasi Risiko Klinis &amp; Pilihan Terapi</text>
  <text x="650" y="350" font-size="13" text-anchor="middle" fill="#075985">Zona diskriminatori: &#946;-hCG 1.500 - 3.500 IU/L tanpa kantung intrauterin</text>

  <!-- 3 Options for Stable -->
  <path d="M 500 362 L 500 385" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M 650 362 L 650 385" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M 800 362 L 800 385" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Option A: Bedah Elektif / Laparoskopi -->
  <rect x="430" y="390" width="130" height="175" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="495" y="410" font-size="13" font-weight="bold" text-anchor="middle" fill="#9f1239">BEDAH ELEKTIF</text>
  <text x="495" y="426" font-size="13" text-anchor="middle" fill="#be123c">(Laparoskopi)</text>
  <text x="438" y="446" font-size="12" fill="#475569">Indikasi:</text>
  <text x="438" y="462" font-size="12" fill="#881337">• &#946;-hCG &#8805; 5.000 IU/L</text>
  <text x="438" y="478" font-size="12" fill="#881337">• Massa &#8805; 35 mm</text>
  <text x="438" y="494" font-size="12" fill="#881337">• DJJ janin (+)</text>
  <text x="438" y="510" font-size="12" fill="#881337">• Nyeri signifikan</text>
  <text x="438" y="526" font-size="12" fill="#881337">• Kontraindikasi MTX</text>
  <text x="438" y="550" font-size="12" font-weight="bold" fill="#9f1239">Salpingektomi</text>

  <!-- Option B: Metotreksat -->
  <rect x="570" y="390" width="155" height="175" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="647" y="410" font-size="13" font-weight="bold" text-anchor="middle" fill="#166534">METOTREKSAT (MTX)</text>
  <text x="647" y="426" font-size="13" text-anchor="middle" fill="#15803d">50 mg/m&#178; IM Hari 1</text>
  <text x="578" y="446" font-size="12" fill="#475569">Kriteria:</text>
  <text x="578" y="462" font-size="12" fill="#14532d">• &#946;-hCG &lt; 1.500 IU/L</text>
  <text x="578" y="478" font-size="12" fill="#14532d">  (atau 1.500-5.000)</text>
  <text x="578" y="494" font-size="12" fill="#14532d">• Massa &lt; 35 mm</text>
  <text x="578" y="510" font-size="12" fill="#14532d">• DJJ (-), nyeri minimal</text>
  <text x="578" y="526" font-size="12" fill="#14532d">• Pasien patuh kontrol</text>
  <text x="578" y="550" font-size="12" font-weight="bold" fill="#166534">Cek H4 &amp; H7 (&#8595;&#8805;15%)</text>

  <!-- Option C: Ekspektatif -->
  <rect x="735" y="390" width="125" height="175" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="797" y="410" font-size="13" font-weight="bold" text-anchor="middle" fill="#6b21a8">EKSPEKTATIF</text>
  <text x="797" y="426" font-size="13" text-anchor="middle" fill="#7e22ce">(Observasi Ketat)</text>
  <text x="742" y="446" font-size="12" fill="#475569">Kriteria:</text>
  <text x="742" y="462" font-size="12" fill="#581c87">• Tanpa gejala</text>
  <text x="742" y="478" font-size="12" fill="#581c87">• &#946;-hCG &#8804; 1.000 IU/L</text>
  <text x="742" y="494" font-size="12" fill="#581c87">• Tren spontan turun</text>
  <text x="742" y="510" font-size="12" fill="#581c87">• Massa sangat kecil</text>
  <text x="742" y="534" font-size="12" font-weight="bold" fill="#6b21a8">Cek H2, H4, H7</text>
  <text x="742" y="550" font-size="12" fill="#581c87">Turun &#8805;15% berkala</text>

  <!-- Footer / Note -->
  <rect x="20" y="575" width="840" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="597" font-size="12" text-anchor="middle" fill="#475569">Catatan: Berikan Anti-D Imunoglobulin (RhoGAM) 50 mcg (&lt;12 mg) atau 300 mcg (&gt;12 mg) IM dalam 72 jam bila pasien Rh-negatif. Hindari asam folat dan OAINS selama terapi MTX.</text>
</svg>
