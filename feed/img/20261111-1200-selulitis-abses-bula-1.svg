<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="480" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2b4a6b"/></marker></defs><text x="450" y="34" font-size="19" font-weight="bold" fill="#1a2433" text-anchor="middle">Kedalaman infeksi menentukan diagnosis</text><rect x="40" y="60" width="380" height="58" fill="#f7e9df" stroke="#8a6f5f"/><text x="56" y="94" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="start">Epidermis</text><rect x="40" y="118" width="380" height="58" fill="#f2d4c4" stroke="#8a6f5f"/><text x="56" y="152" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="start">Dermis superfisial + limfatik superfisial</text><rect x="40" y="176" width="380" height="58" fill="#eabfa9" stroke="#8a6f5f"/><text x="56" y="210" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="start">Dermis dalam</text><rect x="40" y="234" width="380" height="58" fill="#f6e7b8" stroke="#8a6f5f"/><text x="56" y="268" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="start">Jaringan subkutan (hipodermis)</text><rect x="40" y="292" width="380" height="58" fill="#d9e4ee" stroke="#8a6f5f"/><text x="56" y="326" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="start">Fasia otot</text><rect x="40" y="350" width="380" height="58" fill="#c7b0b0" stroke="#8a6f5f"/><text x="56" y="384" font-size="14" font-weight="bold" fill="#1a2433" text-anchor="start">Otot dan vena dalam</text><line x1="420" y1="144" x2="500" y2="144" stroke="#c0392b" stroke-width="2"/><circle cx="420" cy="144" r="4" fill="#c0392b"/><text x="510" y="140" font-size="15" font-weight="bold" fill="#a3281c" text-anchor="start">Erisipelas</text><text x="510" y="158" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Dermis superfisial + limfatik</text><text x="510" y="175" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Batas TEGAS, meninggi</text><line x1="420" y1="236.8" x2="500" y2="236.8" stroke="#c0392b" stroke-width="2"/><circle cx="420" cy="236.8" r="4" fill="#c0392b"/><text x="510" y="232.8" font-size="15" font-weight="bold" fill="#a3281c" text-anchor="start">Selulitis</text><text x="510" y="250.8" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Dermis dalam + subkutan</text><text x="510" y="267.8" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Batas TIDAK tegas, datar</text><line x1="420" y1="318" x2="500" y2="318" stroke="#c0392b" stroke-width="2"/><circle cx="420" cy="318" r="4" fill="#c0392b"/><text x="510" y="314" font-size="15" font-weight="bold" fill="#a3281c" text-anchor="start">Necrotizing fasciitis</text><text x="510" y="332" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Fasia + subkutan</text><text x="510" y="349" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Nyeri tak sebanding kulit</text><line x1="420" y1="376" x2="500" y2="376" stroke="#c0392b" stroke-width="2"/><circle cx="420" cy="376" r="4" fill="#c0392b"/><text x="510" y="372" font-size="15" font-weight="bold" fill="#a3281c" text-anchor="start">Deep vein thrombosis</text><text x="510" y="390" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Vena dalam di antara otot</text><text x="510" y="407" font-size="13" font-weight="normal" fill="#33475b" text-anchor="start">Bukan infeksi: bekuan darah</text><text x="40" y="440" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Abses = kumpulan pus berdinding di dermis/subkutan (fluktuasi +), perlu insisi dan drainase.</text><text x="40" y="462" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Bula = pemisahan lapisan kulit oleh cairan; pada infeksi tungkai, waspadai tanda infeksi lebih dalam.</text></svg>
