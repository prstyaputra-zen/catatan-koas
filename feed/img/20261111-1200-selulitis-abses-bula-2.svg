<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="510" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2b4a6b"/></marker></defs><text x="450" y="32" font-size="19" font-weight="bold" fill="#1a2433" text-anchor="middle">Alur infeksi kulit menurut IDSA 2014</text><rect x="300" y="50" width="300" height="46" rx="8" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/><text x="450" y="79" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Infeksi kulit dan jaringan lunak</text><line x1="380" y1="96" x2="220" y2="130" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><line x1="520" y1="96" x2="680" y2="130" stroke="#2b4a6b" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="132" width="320" height="56" rx="8" fill="#fdecea" stroke="#2b4a6b" stroke-width="1.5"/><text x="220" y="156" font-size="15" font-weight="bold" fill="#1a2433" text-anchor="middle">NONPURULEN</text><text x="220" y="176" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="middle">selulitis, erisipelas, nekrotikans</text><rect x="520" y="132" width="320" height="56" rx="8" fill="#fff4dd" stroke="#2b4a6b" stroke-width="1.5"/><text x="680" y="156" font-size="15" font-weight="bold" fill="#1a2433" text-anchor="middle">PURULEN</text><text x="680" y="176" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="middle">furunkel, karbunkel, abses</text><text x="70" y="212" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Ringan: tanpa tanda sistemik</text><text x="70" y="231" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  → antibiotik oral antistreptokokus</text><text x="70" y="250" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Sedang: ada tanda sistemik</text><text x="70" y="269" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  → antibiotik IV (penisilin, ceftriaxone,</text><text x="70" y="288" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">     cefazolin, klindamisin)</text><text x="70" y="307" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Berat: gagal oral, SIRS + hipotensi,</text><text x="70" y="326" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  imunokompromais, curiga nekrotikans</text><text x="70" y="345" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  → eksplorasi bedah + vankomisin</text><text x="70" y="364" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">     + piperasilin-tazobaktam</text><text x="530" y="212" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Semua derajat: INSISI DAN DRAINASE</text><text x="530" y="231" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  + kultur pus (sedang dan berat)</text><text x="530" y="250" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Sedang/berat (ada SIRS):</text><text x="530" y="269" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  → tambah antibiotik empiris</text><text x="530" y="288" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">  (cakupan MRSA bila ada faktor risiko)</text><text x="530" y="307" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start"></text><text x="530" y="326" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="start">Ringan: insisi dan drainase saja</text><rect x="60" y="400" width="780" height="66" rx="8" fill="#eef5f9" stroke="#9fb3c8" stroke-width="1.5"/><text x="450" y="424" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="middle">SIRS (IDSA): suhu &gt; 38 °C atau &lt; 36 °C, napas &gt; 24x/menit,</text><text x="450" y="444" font-size="13" font-weight="normal" fill="#1a2433" text-anchor="middle">nadi &gt; 90x/menit, atau leukosit &gt; 12.000 atau &lt; 4.000/µL</text><text x="450" y="490" font-size="12.5" font-weight="normal" fill="#33475b" text-anchor="middle">Lama antibiotik selulitis: 5 hari, diperpanjang bila belum membaik. Elevasi tungkai dan obati faktor predisposisi.</text></svg>
