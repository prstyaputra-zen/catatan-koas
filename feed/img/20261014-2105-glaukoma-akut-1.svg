<text x="840" y="146" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Badan</text>
<text x="840" y="160" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">siliar</text>
<ellipse cx="840" cy="266" rx="38" ry="78" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
