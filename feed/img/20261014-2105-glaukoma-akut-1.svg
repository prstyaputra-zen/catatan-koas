<text x="778" y="260" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">blok pupil</text>
<circle cx="792" cy="124" r="9" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="792" cy="408" r="9" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="778" y="116" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">sudut tertutup</text>
<text x="490" y="448" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="start">Akuos terperangkap di belakang iris, iris terdorong ke depan</text>
<text x="490" y="466" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="start">(iris bombe) dan menutup sudut: TIO melonjak.</text>
<text x="20" y="508" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Kerja obat pada serangan (StatPearls 2026; RVEEH 2022)</text>
<rect x="20" y="522" width="880" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="34" y="547" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Kurangi produksi akuos</text>
<text x="280" y="547" font-size="13" font-weight="400" fill="#374151" text-anchor="start">asetazolamid 500 mg PO/IV, timolol 0,5%, apraklonidin 1%</text>
<rect x="20" y="568" width="880" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="34" y="593" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Tarik cairan dari mata</text>
<text x="280" y="593" font-size="13" font-weight="400" fill="#374151" text-anchor="start">manitol IV 1–2 g/kg (bila asetazolamid IV gagal)</text>
<rect x="20" y="614" width="880" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="34" y="639" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Buka sudut</text>
<text x="280" y="639" font-size="13" font-weight="400" fill="#374151" text-anchor="start">pilokarpin 1–2% setelah TIO &lt; 40 mmHg</text>
<rect x="20" y="660" width="880" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="34" y="685" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Atasi radang</text>
<text x="280" y="685" font-size="13" font-weight="400" fill="#374151" text-anchor="start">steroid topikal</text>
<rect x="20" y="706" width="880" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="34" y="731" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">Terapi definitif</text>
<text x="280" y="731" font-size="13" font-weight="400" fill="#374151" text-anchor="start">iridotomi perifer laser (LPI), juga mata sebelahnya</text>
