<text x="40" y="448" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="start">Akuos dibuat badan siliar, melewati pupil, keluar lewat</text>
<text x="40" y="466" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="start">jaringan trabekular dan kanal Schlemm (cokelat).</text>
