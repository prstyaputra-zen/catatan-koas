<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/><text x="450" y="32" font-size="19" font-weight="bold" fill="#1a2433" text-anchor="middle">Erisipelas dibanding selulitis</text><rect x="40" y="50" width="200" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="48" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Ciri</text><rect x="240" y="50" width="310" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="248" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Erisipelas</text><rect x="550" y="50" width="310" height="36" fill="#1f6f8b" stroke="#9fb3c8"/><text x="558" y="73.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Selulitis</text><rect x="40" y="86" width="200" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="48" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Lapisan</text><rect x="240" y="86" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="248" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Dermis superfisial + limfatik</text><rect x="550" y="86" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="558" y="109.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Dermis dalam + subkutan</text><rect x="40" y="122" width="200" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="48" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Batas lesi</text><rect x="240" y="122" width="310" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="248" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Tegas, meninggi</text><rect x="550" y="122" width="310" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="558" y="145.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Tidak tegas, datar</text><rect x="40" y="158" width="200" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="48" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Perkembangan</text><rect x="240" y="158" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="248" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Lebih cepat</text><rect x="550" y="158" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="558" y="181.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Lebih lambat</text><rect x="40" y="194" width="200" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="48" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Penyebab tersering</text><rect x="240" y="194" width="310" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="248" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Streptococcus grup A</text><rect x="550" y="194" width="310" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="558" y="217.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Streptococcus β-hemolitikus, MSSA</text><rect x="40" y="230" width="200" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="48" y="253.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Lokasi tersering</text><rect x="240" y="230" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="248" y="253.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Tungkai bawah, lalu wajah</text><rect x="550" y="230" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="558" y="253.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Tungkai bawah, unilateral</text><rect x="40" y="266" width="200" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="48" y="289.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Terapi</text><rect x="240" y="266" width="310" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="248" y="289.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Antistreptokokus (penisilin)</text><rect x="550" y="266" width="310" height="36" fill="#ffffff" stroke="#9fb3c8"/><text x="558" y="289.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Antistreptokokus ± MSSA</text><rect x="40" y="302" width="200" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="48" y="325.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">Profilaksis</text><rect x="240" y="302" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="248" y="325.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">3-4 episode/tahun: pertimbangkan</text><rect x="550" y="302" width="310" height="36" fill="#eef5f9" stroke="#9fb3c8"/><text x="558" y="325.0" font-size="13.5" font-weight="normal" fill="#1a2433" text-anchor="start">3-4 episode/tahun: pertimbangkan</text><text x="450" y="362" font-size="13" font-weight="normal" fill="#33475b" text-anchor="middle">Keduanya diagnosis klinis dan sering tumpang tindih; terapi awal sama-sama menyasar streptokokus.</text></svg>
