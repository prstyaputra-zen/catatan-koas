<text x="744.0" y="398" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Tipe 2 (ENL): BL dan LL</text>
<rect x="126" y="418" width="300" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="276.0" y="438" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">WHO PB: 1–5 lesi, BTA negatif</text>
<rect x="438" y="418" width="456" height="30" rx="8" fill="#ffe4e6" stroke="#e11d48"/>
<text x="666.0" y="438" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="middle">WHO MB: &gt; 5 lesi, atau saraf terlibat, atau BTA positif</text>
<text x="120" y="466" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">Pengelompokan PB/MB pada gambar hanya perkiraan; yang menentukan adalah kriteria WHO di atas.</text>
<text x="20" y="506" font-size="15" font-weight="700" fill="#111827" text-anchor="start">B. Tanda kardinal (cukup satu)</text>
<rect x="20" y="520" width="410" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<circle cx="44" cy="543" r="14" fill="#2563eb"/>
<text x="44" y="548" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="68" y="548" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">Bercak putih/kemerahan yang mati rasa</text>
<rect x="20" y="574" width="410" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<circle cx="44" cy="597" r="14" fill="#2563eb"/>
