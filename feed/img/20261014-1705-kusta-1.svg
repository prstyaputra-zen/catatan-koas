<text x="68" y="602" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">Saraf tepi menebal + gangguan fungsi</text>
<rect x="20" y="628" width="410" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<circle cx="44" cy="651" r="14" fill="#2563eb"/>
<text x="44" y="656" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="68" y="656" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">BTA positif pada kerokan jaringan kulit</text>
<text x="20" y="704" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Uji rasa raba: ujung kapas. Nyeri: ujung jarum.</text>
<text x="20" y="722" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Suhu: tabung air hangat vs dingin.</text>
<text x="20" y="746" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Mati rasa = luka tanpa disadari = cacat.</text>
<text x="470" y="506" font-size="15" font-weight="700" fill="#111827" text-anchor="start">C. Saraf tepi yang sering menebal</text>
