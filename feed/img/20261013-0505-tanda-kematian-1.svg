<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Linimasa perubahan pascamati (perkiraan)</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik · rentang berbeda antarsumber dan sangat dipengaruhi suhu lingkungan, pakaian, dan tubuh</text>
<line x1="210" y1="80" x2="210" y2="450" stroke="#e5e7eb"/>
<text x="210.0" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">0 jam</text>
<line x1="266" y1="80" x2="266" y2="450" stroke="#e5e7eb"/>
<text x="265.8333333333333" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">6 jam</text>
<line x1="322" y1="80" x2="322" y2="450" stroke="#e5e7eb"/>
<text x="321.66666666666663" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">12 jam</text>
<line x1="433" y1="80" x2="433" y2="450" stroke="#e5e7eb"/>
<text x="433.3333333333333" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">24 jam</text>
<line x1="545" y1="80" x2="545" y2="450" stroke="#e5e7eb"/>
<text x="545.0" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">36 jam</text>
<line x1="657" y1="80" x2="657" y2="450" stroke="#e5e7eb"/>
<text x="656.6666666666666" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">48 jam</text>
<line x1="880" y1="80" x2="880" y2="450" stroke="#e5e7eb"/>
<text x="880.0" y="468" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">72 jam</text>
<text x="198" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="end">Lebam mayat</text>
<text x="198" y="138" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end">livor mortis</text>
<line x1="20" y1="154" x2="880" y2="154" stroke="#f3f4f6"/>
<text x="198" y="194" font-size="14" font-weight="700" fill="#111827" text-anchor="end">Kaku mayat</text>
<text x="198" y="212" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end">rigor mortis</text>
<line x1="20" y1="228" x2="880" y2="228" stroke="#f3f4f6"/>
<text x="198" y="268" font-size="14" font-weight="700" fill="#111827" text-anchor="end">Penurunan suhu</text>
<text x="198" y="286" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end">algor mortis</text>
<line x1="20" y1="302" x2="880" y2="302" stroke="#f3f4f6"/>
<text x="198" y="342" font-size="14" font-weight="700" fill="#111827" text-anchor="end">Pembusukan awal</text>
<text x="198" y="360" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end">hijau di fosa iliaka kanan</text>
<line x1="20" y1="376" x2="880" y2="376" stroke="#f3f4f6"/>
<text x="198" y="416" font-size="14" font-weight="700" fill="#111827" text-anchor="end">Pembengkakan</text>
<text x="198" y="434" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end">bloating, marbling</text>
<line x1="20" y1="450" x2="880" y2="450" stroke="#f3f4f6"/>
<rect x="215" y="110" width="14" height="22" rx="4" fill="#c4b5fd"/>
<text x="221.16666666666666" y="104" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="start">muncul ½-2 jam</text>
<rect x="229" y="110" width="56" height="22" rx="4" fill="#a78bfa"/>
<rect x="284" y="110" width="596" height="22" rx="4" fill="#7c3aed"/>
<text x="582.2222222222222" y="126" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">menetap (fixed): 6-8 jam* atau &gt; 12 jam**</text>
<rect x="219" y="184" width="28" height="22" rx="4" fill="#fdba74"/>
<rect x="247" y="184" width="74" height="22" rx="4" fill="#fb923c"/>
<rect x="322" y="184" width="112" height="22" rx="4" fill="#ea580c"/>
<text x="377.5" y="200" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">bertahan ± 12 jam</text>
<rect x="433" y="184" width="112" height="22" rx="4" fill="#fed7aa"/>
<text x="489.16666666666663" y="200" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">hilang ± 36 jam**</text>
<text x="219.30555555555554" y="178" font-size="11.5" font-weight="700" fill="#9a3412" text-anchor="start">mulai di wajah 1-4 jam*, lengkap 6-12 jam</text>
<rect x="210" y="258" width="223" height="22" rx="4" fill="#93c5fd"/>
<text x="441.3333333333333" y="274" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">turun bertahap sampai sama dengan suhu lingkungan (± 18-24 jam*)</text>
<rect x="322" y="332" width="112" height="22" rx="4" fill="#86efac" stroke="#374151" stroke-dasharray="4 3" fill-opacity="0.35"/>
<rect x="433" y="332" width="447" height="22" rx="4" fill="#22c55e"/>
<text x="656.6666666666666" y="348" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">24-72 jam (iklim sedang)*</text>
<text x="321.66666666666663" y="326" font-size="11.5" font-weight="700" fill="#166534" text-anchor="start">12-24 jam bila panas*</text>
<rect x="433" y="406" width="223" height="22" rx="4" fill="#a3a3a3"/>
<text x="545.0" y="422" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">24-48 jam*</text>
<text x="20" y="500" font-size="12" font-weight="400" fill="#374151" text-anchor="start">* Zubair &amp; Menezes, StatPearls (2026)   ** Shrestha dkk., StatPearls (2023). Kaku mayat terlambat hilang pada suhu dingin, lebih cepat pada suhu panas.</text>
<text x="20" y="522" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="start">Jangan memperkirakan saat kematian dari satu tanda saja; gabungkan beberapa tanda dan kondisi lingkungan.</text>
</svg>
