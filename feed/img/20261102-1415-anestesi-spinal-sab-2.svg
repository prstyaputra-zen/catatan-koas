<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="900" height="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#475569"/></marker>
  <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0284c7"/></marker>
  <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/></marker>
</defs>
<rect width="900" height="1020" fill="#ffffff"/>

<!-- Header Banner -->
<rect x="15" y="12" width="870" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="30" y="36" font-size="16" font-weight="700" fill="#0f172a">Anestesi Spinal (Blok Subaraknoid): Lapisan Pungsi, Dermatom, Hemodinamik &amp; PDPH</text>
<text x="30" y="56" font-size="11.5" fill="#475569">Panduan komprehensif anatomi tusukan midline, blokade diferensial simpatis, prevensi hipotensi, dan tatalaksana komplikasi</text>

<!-- Section 1: Anatomi Lapisan Pungsi & Komparasi Jarum -->
<rect x="15" y="80" width="870" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="15" y="80" width="870" height="30" rx="8" fill="#f1f5f9"/>
<text x="28" y="100" font-size="13" font-weight="700" fill="#0f172a">1. Urutan 8 Lapisan Anatomis Pendekatan Midline &amp; Karakteristik Jarum Spinal</text>

<!-- Box 1A: 8 Lapisan Midline -->
<rect x="25" y="118" width="530" height="185" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="25" y="118" width="530" height="24" rx="6" fill="#e0f2fe"/>
<text x="35" y="134" font-size="11.5" font-weight="700" fill="#0369a1">A. Urutan Lapisan Ditembus Jarum Spinal (Permukaan ke Dalam)</text>

<!-- Step 1-4 -->
<g transform="translate(35, 150)">
  <rect x="0" y="0" width="240" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="15" font-size="10.5" font-weight="700" fill="#0f172a">1. Kulit (Skin) &amp; 2. Subkutis</text>
  <text x="8" y="27" font-size="9.5" fill="#64748b">Infiltrasi lidokain 1-2%, bantalan lemak</text>

  <rect x="0" y="38" width="240" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="53" font-size="10.5" font-weight="700" fill="#0f172a">3. Lig. Supraspinosum</text>
  <text x="8" y="65" font-size="9.5" fill="#64748b">Menghubungkan apeks prosesus spinosus</text>

  <rect x="0" y="76" width="240" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="91" font-size="10.5" font-weight="700" fill="#0f172a">4. Lig. Interspinosum</text>
  <text x="8" y="103" font-size="9.5" fill="#64748b">Serat kolagen menyilang, tahanan kenyal</text>

  <rect x="0" y="114" width="240" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="8" y="129" font-size="10.5" font-weight="700" fill="#b45309">5. Ligamentum Flavum</text>
  <text x="8" y="141" font-size="9.5" fill="#78350f">Kaya elastin, resistensi kuat ("pop" ke-1)</text>
</g>

<!-- Step 5-8 -->
<g transform="translate(295, 150)">
  <rect x="0" y="0" width="245" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="8" y="15" font-size="10.5" font-weight="700" fill="#334155">6. Ruang Epidural (Potensial)</text>
  <text x="8" y="27" font-size="9.5" fill="#475569">Pleksus vena Batson &amp; bantalan lemak</text>

  <rect x="0" y="38" width="245" height="32" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="8" y="53" font-size="10.5" font-weight="700" fill="#b91c1c">7. Dura Mater &amp; Araknoid</text>
  <text x="8" y="65" font-size="9.5" fill="#991b1b">Tahanan halus menyerupai kertas ("pop" ke-2)</text>

  <rect x="0" y="76" width="245" height="42" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <text x="8" y="92" font-size="11" font-weight="700" fill="#15803d">8. Ruang Subaraknoid (SAS)</text>
  <text x="8" y="105" font-size="9.5" fill="#166534">Berisi LCS jernih ("no drop no anesthesia")</text>
  <text x="8" y="115" font-size="9" font-weight="700" fill="#15803d">Garis Tuffier (L4) → Sela L3-L4 / L4-L5</text>
</g>

<!-- Box 1B: Perbandingan Jarum -->
<rect x="565" y="118" width="310" height="185" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="565" y="118" width="310" height="24" rx="6" fill="#f3e8ff"/>
<text x="575" y="134" font-size="11.5" font-weight="700" fill="#7e22ce">B. Jenis Jarum Spinal: Cutting vs Pensil</text>

<g transform="translate(575, 148)">
  <rect x="0" y="0" width="290" height="66" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="8" y="15" font-size="10.5" font-weight="700" fill="#b91c1c">Jarum Quincke (Cutting / Pemotong)</text>
  <text x="8" y="29" font-size="9.5" fill="#7f1d1d">• Ujung tajam menyayat serat elastis dura mater</text>
  <text x="8" y="42" font-size="9.5" fill="#7f1d1d">• Lubang dural menganga, kebocoran LCS deras</text>
  <text x="8" y="56" font-size="9.5" font-weight="700" fill="#dc2626">• Insidensi PDPH tinggi: mencapai 10 - 25%</text>

  <rect x="0" y="74" width="290" height="74" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="8" y="89" font-size="10.5" font-weight="700" fill="#15803d">Jarum Whitacre / Sprotte (Pencil-point)</text>
  <text x="8" y="103" font-size="9.5" fill="#14532d">• Ujung tumpul konikal memisahkan serat dura</text>
  <text x="8" y="116" font-size="9.5" fill="#14532d">• Lubang menutup elastis kembali pasca-cabut</text>
  <text x="8" y="129" font-size="9.5" fill="#14532d">• Lubang injeksi berada di sisi lateral (side port)</text>
  <text x="8" y="142" font-size="9.5" font-weight="700" fill="#16a34a">• Insidensi PDPH sangat rendah: &lt; 1 - 2% (25-27G)</text>
</g>

<!-- Section 2: Dermatom Landmark & Blokade Diferensial -->
<rect x="15" y="323" width="870" height="215" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="15" y="323" width="870" height="30" rx="8" fill="#f1f5f9"/>
<text x="28" y="343" font-size="13" font-weight="700" fill="#0f172a">2. Ketinggian Dermatom Klinis &amp; Hukum Blokade Diferensial Saraf</text>

<!-- Box 2A: Dermatom -->
<rect x="25" y="361" width="410" height="165" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="25" y="361" width="410" height="24" rx="6" fill="#e0e7ff"/>
<text x="35" y="377" font-size="11.5" font-weight="700" fill="#3730a3">A. Landmark Dermatom Klinis Anestesi</text>

<g transform="translate(35, 393)">
  <rect x="0" y="0" width="390" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="14" font-size="10.5" font-weight="700" fill="#1e1b4b">T4 (Papila Mammae / Putting)</text>
  <text x="8" y="24" font-size="9" fill="#475569">Target: Seksio Sesarea, Laparotomi Abdomen Atas</text>

  <rect x="0" y="32" width="390" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="46" font-size="10.5" font-weight="700" fill="#1e1b4b">T6 (Prosesus Xifoideus)</text>
  <text x="8" y="56" font-size="9" fill="#475569">Target: Laparotomi Bawah, Kolesistektomi Terbuka</text>

  <rect x="0" y="64" width="390" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="78" font-size="10.5" font-weight="700" fill="#1e1b4b">T10 (Umbilikus / Pusar)</text>
  <text x="8" y="88" font-size="9" fill="#475569">Target: Apendektomi, Herniorafi Inguinal, TURP Urologi</text>

  <rect x="0" y="96" width="390" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="8" y="110" font-size="10.5" font-weight="700" fill="#1e1b4b">L1 (Lipat Paha) &amp; L4 (Garis Tuffier / Krista Iliaka)</text>
  <text x="8" y="121" font-size="9" fill="#475569">Target: Bedah Genitalia, Perineum, dan Ekstremitas Bawah</text>
</g>

<!-- Box 2B: Blokade Diferensial -->
<rect x="445" y="361" width="430" height="165" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="445" y="361" width="430" height="24" rx="6" fill="#fef3c7"/>
<text x="455" y="377" font-size="11.5" font-weight="700" fill="#92400e">B. Hierarki Blokade Diferensial Serabut Saraf</text>

<g transform="translate(455, 393)">
  <rect x="0" y="0" width="410" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="8" y="14" font-size="10.5" font-weight="700" fill="#1e40af">1. Blok Simpatis (Serabut B Otonom, Mielin Tipis)</text>
  <text x="8" y="27" font-size="9.5" fill="#1e3a8a">• Onset tercepat, vasodilatasi perifer masif</text>
  <text x="8" y="34" font-size="9" font-weight="700" fill="#2563eb">→ Level blokade 2 - 4 SEGMEN LEBIH TINGGI dari sensorik!</text>

  <rect x="0" y="44" width="410" height="36" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="8" y="58" font-size="10.5" font-weight="700" fill="#166534">2. Blok Sensorik (Serabut C &amp; A-delta, Nyeri &amp; Suhu)</text>
  <text x="8" y="71" font-size="9.5" fill="#14532d">• Onset intermediat, hilangnya sensasi dingin lalu pinprick</text>
  <text x="8" y="78" font-size="9" font-weight="700" fill="#16a34a">→ Menjadi patokan utama level dermatom anestesi bedah</text>

  <rect x="0" y="88" width="410" height="38" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="8" y="102" font-size="10.5" font-weight="700" fill="#991b1b">3. Blok Motorik (Serabut A-alfa, Mielin Tebal)</text>
  <text x="8" y="115" font-size="9.5" fill="#7f1d1d">• Paling resisten, terblokir terakhir, relaksasi otot skeletal</text>
  <text x="8" y="123" font-size="9" font-weight="700" fill="#dc2626">→ Level blokade motorik 2 SEGMEN LEBIH RENDAH dari sensorik</text>
</g>

<!-- Section 3: Manajemen Hipotensi & Total Spinal -->
<rect x="15" y="546" width="870" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="15" y="546" width="870" height="30" rx="8" fill="#f1f5f9"/>
<text x="28" y="566" font-size="13" font-weight="700" fill="#0f172a">3. Algoritma Prevensi &amp; Tatalaksana Kedaruratan Hemodinamik (Kinsella 2018 / ASA)</text>

<!-- Box 3A: Patofisiologi & Cairan -->
<rect x="25" y="584" width="280" height="185" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="25" y="584" width="280" height="24" rx="6" fill="#e0f2fe"/>
<text x="35" y="600" font-size="11" font-weight="700" fill="#0369a1">A. Mekanisme &amp; Cairan Ko-loading</text>

<g transform="translate(35, 615)">
  <text x="0" y="14" font-size="10" font-weight="700" fill="#0f172a">Kaskade Hipotensi Spinal:</text>
  <text x="0" y="27" font-size="9" fill="#334155">• Blok simpatis → tonus vasomotor lenyap</text>
  <text x="0" y="39" font-size="9" fill="#334155">• Venous pooling masif di splanknikus &amp; kaki</text>
  <text x="0" y="51" font-size="9" fill="#334155">• Aliran balik vena (preload) turun drastis</text>
  <text x="0" y="63" font-size="9" fill="#334155">• Curah jantung anjlok → TD &lt; 90% baseline</text>

  <rect x="0" y="73" width="260" height="65" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="6" y="87" font-size="10" font-weight="700" fill="#1e40af">Strategi Terapi Cairan:</text>
  <text x="6" y="100" font-size="9" font-weight="700" fill="#0284c7">• Ko-loading Kristaloid (1000 - 1500 mL RL)</text>
  <text x="6" y="112" font-size="8.5" fill="#334155">Diguyur CEPAT saat suntik intratekal!</text>
  <text x="6" y="124" font-size="8.5" fill="#64748b">(Pre-loading kurang efektif: cepat keluar urin)</text>
  <text x="6" y="134" font-size="8.5" fill="#334155">• Uterine displacement 15° pada bumil (cegah supine)</text>
</g>

<!-- Box 3B: Pilihan Vasopresor -->
<rect x="315" y="584" width="270" height="185" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="315" y="584" width="270" height="24" rx="6" fill="#dcfce7"/>
<text x="325" y="600" font-size="11" font-weight="700" fill="#15803d">B. Pilihan Vasopresor Rasional</text>

<g transform="translate(325, 615)">
  <rect x="0" y="0" width="250" height="65" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="6" y="14" font-size="10" font-weight="700" fill="#166534">Fenilefrin (Lini Pertama Baku)</text>
  <text x="6" y="27" font-size="9" fill="#14532d">• Agonis alfa-1 selektif → vasokonstriksi</text>
  <text x="6" y="39" font-size="9" fill="#14532d">• Bolus 50 - 100 mcg IV / Infus 25-50 mcg/m</text>
  <text x="6" y="51" font-size="9" fill="#14532d">• Aman untuk janin (tidak memicu asidosis)</text>
  <text x="6" y="61" font-size="8.5" font-weight="700" fill="#b91c1c">! Waspada refleks bradikardia</text>

  <rect x="0" y="73" width="250" height="65" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="6" y="87" font-size="10" font-weight="700" fill="#b45309">Efedrin (Bila Hipotensi + HR &lt; 60 bpm)</text>
  <text x="6" y="100" font-size="9" fill="#78350f">• Agonis alfa &amp; beta-1 adrenergik</text>
  <text x="6" y="112" font-size="9" fill="#78350f">• Bolus 5 - 10 mg IV (titrasi tiap 2-5 m)</text>
  <text x="6" y="124" font-size="9" fill="#78350f">• Meningkatkan HR &amp; kontraktilitas jantung</text>
  <text x="6" y="134" font-size="8.5" font-weight="700" fill="#b45309">• Sulfas Atropin 0,5 mg IV bila bradikardia berat</text>
</g>

<!-- Box 3C: Kedaruratan Total Spinal -->
<rect x="595" y="584" width="280" height="185" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="595" y="584" width="280" height="24" rx="6" fill="#fee2e2"/>
<text x="605" y="600" font-size="11" font-weight="700" fill="#b91c1c">C. Kedaruratan High / Total Spinal</text>

<g transform="translate(605, 615)">
  <text x="0" y="13" font-size="9.5" font-weight="700" fill="#7f1d1d">Tanda Bahaya Blok Tinggi (T1 - C3):</text>
  <text x="0" y="25" font-size="8.5" fill="#991b1b">• Kesemutan jari C7-C8, suara melemah/bisik</text>
  <text x="0" y="36" font-size="8.5" fill="#991b1b">• Sesak napas (paralisis interkostal T1-T11)</text>
  <text x="0" y="47" font-size="8.5" fill="#991b1b">• Apnea (mencapai C3-C5 n. frenikus diafragma)</text>
  <text x="0" y="58" font-size="8.5" fill="#991b1b">• Hipotensi kolaps + Bradikardia (blok T1-T4)</text>

  <rect x="0" y="66" width="260" height="72" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="6" y="79" font-size="9.5" font-weight="700" fill="#b91c1c">Protokol Resusitasi Darurat (A-B-C-D):</text>
  <text x="6" y="91" font-size="8.5" fill="#7f1d1d">1. Airway/Breathing: O2 100% BVM, Intubasi Cito</text>
  <text x="6" y="102" font-size="8.5" fill="#7f1d1d">2. Circulation: Guyur cairan, elevasi kaki</text>
  <text x="6" y="113" font-size="8.5" fill="#7f1d1d">3. Drugs: Efedrin 10-20 mg / Epinefrin 10-50 mcg IV</text>
  <text x="6" y="124" font-size="8.5" fill="#7f1d1d">4. Atropin 0,5 - 1 mg IV (tangani bradikardia)</text>
  <text x="6" y="134" font-size="8.5" font-weight="700" fill="#dc2626">! Jangan Trendelenburg sebelum fiksasi obat!</text>
</g>

<!-- Section 4: Alur Diagnosis & Tatalaksana PDPH -->
<rect x="15" y="789" width="870" height="215" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="15" y="789" width="870" height="30" rx="8" fill="#f1f5f9"/>
<text x="28" y="809" font-size="13" font-weight="700" fill="#0f172a">4. Alur Evaluasi &amp; Tangga Tatalaksana Post-Dural Puncture Headache (Russell 2023 / ASRA 2024)</text>

<!-- Box 4A: Trias & Gejala Khas -->
<rect x="25" y="827" width="270" height="165" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="25" y="827" width="270" height="24" rx="6" fill="#fef3c7"/>
<text x="35" y="843" font-size="11" font-weight="700" fill="#92400e">A. Karakteristik Klinis Patognomonik</text>

<g transform="translate(35, 858)">
  <text x="0" y="14" font-size="10" font-weight="700" fill="#0f172a">Ciri Utama Nyeri Kepala Postural:</text>
  <text x="0" y="27" font-size="9" fill="#334155">• Memburuk saat duduk / tegak (&lt; 15 menit)</text>
  <text x="0" y="39" font-size="9" fill="#334155">• Mereda bermakna saat berbaring telentang datar</text>
  <text x="0" y="51" font-size="9" fill="#334155">• Onset tersering 24 - 48 jam pasca-prosedur</text>
  <text x="0" y="64" font-size="10" font-weight="700" fill="#0f172a">Gejala Penyerta (Traksi Saraf):</text>
  <text x="0" y="77" font-size="9" fill="#334155">• Kaku leher, mual, fotofobia, tinitus</text>
  <text x="0" y="89" font-size="9" fill="#334155">• Diplopia (traksi n. VI Abdusen)</text>
  <rect x="0" y="98" width="250" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="6" y="111" font-size="8.5" font-weight="700" fill="#b91c1c">Red Flags (Eksklusi Meningitis/CVT):</text>
  <text x="6" y="121" font-size="8" fill="#7f1d1d">Demam tinggi, defisit motorik fokal, kejang</text>
</g>

<!-- Box 4B: Terapi Konservatif & Adjuvan -->
<rect x="305" y="827" width="280" height="165" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="305" y="827" width="280" height="24" rx="6" fill="#e0f2fe"/>
<text x="315" y="843" font-size="11" font-weight="700" fill="#0369a1">B. Langkah 1: Konservatif &amp; Farmakologis</text>

<g transform="translate(315, 858)">
  <rect x="0" y="0" width="260" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="6" y="14" font-size="9.5" font-weight="700" fill="#0f172a">1. Tirah Baring &amp; Hidrasi Oral / IV</text>
  <text x="6" y="26" font-size="8.5" fill="#334155">• Posisi telentang nyaman (bukan imobilisasi kaku)</text>
  <text x="6" y="37" font-size="8.5" fill="#334155">• Hidrasi adekuat 2 - 3 liter/hari (dukung prod. LCS)</text>

  <rect x="0" y="48" width="260" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="6" y="62" font-size="9.5" font-weight="700" fill="#0f172a">2. Analgesia Multimodal</text>
  <text x="6" y="74" font-size="8.5" fill="#334155">• Parasetamol 1000 mg PO/IV tiap 6 jam</text>
  <text x="6" y="85" font-size="8.5" fill="#334155">• Ibuprofen 400-600 mg PO q8h / Ketorolac 30 mg IV</text>

  <rect x="0" y="96" width="260" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="6" y="110" font-size="9.5" font-weight="700" fill="#1d4ed8">3. Kafein Oral / IV (Vasokonstriktor Serebral)</text>
  <text x="6" y="122" font-size="8.5" fill="#1e40af">Kafein 300-500 mg (antagonis adenosina)</text>
</g>

<!-- Box 4C: Terapi Definitif EBP -->
<rect x="595" y="827" width="280" height="165" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="595" y="827" width="280" height="24" rx="6" fill="#f3e8ff"/>
<text x="605" y="843" font-size="11" font-weight="700" fill="#7e22ce">C. Langkah 2 &amp; 3: SPGB &amp; Blood Patch</text>

<g transform="translate(605, 858)">
  <rect x="0" y="0" width="260" height="42" rx="4" fill="#fdf4ff" stroke="#d8b4fe"/>
  <text x="6" y="14" font-size="9.5" font-weight="700" fill="#7e22ce">Blok Ganglion Sfenopalatina (SPGB)</text>
  <text x="6" y="26" font-size="8.5" fill="#581c87">• Aplikator kapas lidokain 2-4% transnasal</text>
  <text x="6" y="37" font-size="8.5" fill="#581c87">• Meredakan nyeri parasimpatis trigeminal</text>

  <rect x="0" y="48" width="260" height="82" rx="4" fill="#faf5ff" stroke="#c084fc"/>
  <text x="6" y="62" font-size="10" font-weight="700" fill="#6b21a8">Epidural Blood Patch (EBP) - Baku Emas</text>
  <text x="6" y="74" font-size="8.5" fill="#4a044e">• Indikasi: PDPH berat/refrakter &gt; 24-48 jam</text>
  <text x="6" y="85" font-size="8.5" fill="#4a044e">• Injeksi 15 - 20 mL darah autolog steril ke epidural</text>
  <text x="6" y="96" font-size="8.5" fill="#4a044e">• Lokasi: Sela sama atau 1 sela di bawah tusukan</text>
  <text x="6" y="107" font-size="8.5" font-weight="700" fill="#7e22ce">• Efek ganda: Tamponade dural + Bekuan fibrin</text>
  <text x="6" y="119" font-size="8.5" font-weight="700" fill="#15803d">• Angka keberhasilan mencapai 70 - 90%</text>
</g>

