<line x1="410" y1="396" x2="530" y2="392" stroke="#9ca3af" stroke-width="1.2"/>
<text x="530" y="396" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="start">lipatan lutut</text>
<rect x="645" y="80" width="240" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="659" y="106" font-size="15" font-weight="700" fill="#92400e" text-anchor="start">Bayi &amp; anak kecil</text>
<text x="659" y="130" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Ruam juga di kepala, wajah,</text>
<text x="659" y="150" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">leher, telapak tangan, dan</text>
<text x="659" y="170" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">telapak kaki.</text>
<text x="659" y="190" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">Gatal hebat, memberat malam</text>
<rect x="645" y="214" width="240" height="186" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="659" y="240" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">Terapi</text>
<text x="659" y="264" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">Permetrin 5% krim:</text>
<text x="659" y="284" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">seluruh tubuh dari leher ke</text>
<text x="659" y="304" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">bawah, bilas 8-14 jam; ulang</text>
<text x="659" y="324" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">±1 minggu bila perlu</text>
<text x="659" y="344" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">Ivermectin oral 200 µg/kg:</text>
<text x="659" y="364" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">2 dosis, jarak 7-14 hari</text>
<text x="659" y="384" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">(tidak untuk hamil / &lt; 15 kg)</text>
<rect x="645" y="414" width="240" height="170" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="659" y="440" font-size="15" font-weight="700" fill="#065f46" text-anchor="start">Kontak &amp; lingkungan</text>
<text x="659" y="464" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">Obati semua kontak serumah</text>
<text x="659" y="484" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">bersamaan, walau tanpa gejala</text>
<text x="659" y="504" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Cuci sprei/baju/handuk</text>
<text x="659" y="524" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">&gt; 50 °C 10 menit, keringkan</text>
<text x="659" y="544" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">panas, atau simpan dalam</text>
<text x="659" y="564" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">plastik tertutup ≥ 72 jam</text>
<text x="20" y="576" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Inkubasi infestasi pertama 4-8 minggu (CDC); penderita sudah bisa menularkan sebelum gejala muncul.</text>
<text x="20" y="598" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Gatal dapat memberat 1-2 minggu setelah terapi dimulai (WHO).</text>
<text x="20" y="632" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Sumber: CDC Scabies (2024): About Scabies &amp; Clinical Care; WHO Fact sheet Scabies (31 Mei 2023).</text>
</svg>
