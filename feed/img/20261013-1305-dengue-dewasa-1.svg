<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="604" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#111827">Perjalanan infeksi dengue: kapan bahaya datang</text>
<text x="20" y="54" font-size="13" fill="#4b5563">Ilustrasi skematik · kurva kualitatif (tanpa skala) · hari sakit perkiraan</text>
<rect x="70" y="110" width="180" height="220" fill="#fef2f2"/>
<rect x="250" y="110" width="360" height="220" fill="#fff7ed"/>
<rect x="610" y="110" width="270" height="220" fill="#ecfdf5"/>
<text x="160.0" y="100" font-size="13.5" font-weight="700" fill="#991b1b" text-anchor="middle">Fase demam (± 3 hari, 2-7)</text>
<text x="430.0" y="100" font-size="13.5" font-weight="700" fill="#9a3412" text-anchor="middle">Fase kritis (bebas demam, hari 3-7)</text>
<text x="745.0" y="100" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">Fase pemulihan (reabsorpsi)</text>
<line x1="70" y1="330" x2="70" y2="336" stroke="#374151"/>
<text x="70.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H1</text>
<line x1="160" y1="330" x2="160" y2="336" stroke="#374151"/>
<text x="160.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H2</text>
<line x1="250" y1="330" x2="250" y2="336" stroke="#374151"/>
<text x="250.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H3</text>
<line x1="340" y1="330" x2="340" y2="336" stroke="#374151"/>
<text x="340.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H4</text>
<line x1="430" y1="330" x2="430" y2="336" stroke="#374151"/>
<text x="430.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H5</text>
<line x1="520" y1="330" x2="520" y2="336" stroke="#374151"/>
<text x="520.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H6</text>
<line x1="610" y1="330" x2="610" y2="336" stroke="#374151"/>
<text x="610.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H7</text>
<line x1="700" y1="330" x2="700" y2="336" stroke="#374151"/>
<text x="700.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H8</text>
<line x1="790" y1="330" x2="790" y2="336" stroke="#374151"/>
<text x="790.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H9</text>
<line x1="880" y1="330" x2="880" y2="336" stroke="#374151"/>
<text x="880.0" y="352" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">H10</text>
<text x="475.0" y="372" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Hari sakit</text>
<path d="M70.0,143.0 L115.0,127.6 L160.0,136.4 L205.0,132.0 L250.0,154.0 L295.0,231.0 L340.0,264.0 L430.0,268.4 L520.0,270.6 L700.0,270.6 L880.0,270.6" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" />
<path d="M70.0,231.0 L160.0,228.8 L250.0,220.0 L340.0,176.0 L430.0,165.0 L520.0,193.6 L610.0,220.0 L700.0,228.8 L880.0,231.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" />
<path d="M70.0,176.0 L160.0,198.0 L250.0,231.0 L340.0,281.6 L430.0,297.0 L520.0,275.0 L610.0,231.0 L700.0,198.0 L880.0,176.0" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="124.0" y="118.80000000000001" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">Suhu</text>
<text x="438.99999999999994" y="154.0" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">Hematokrit naik (kebocoran plasma)</text>
<text x="394.0" y="310.2" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="start">Trombosit turun</text>
<rect x="20" y="400" width="270" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="32" y="422" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Fase demam</text>
<text x="32" y="442" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Demam tinggi, nyeri kepala,</text>
<text x="32" y="460" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">nyeri retro-orbita, otot, sendi</text>
<text x="32" y="478" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">NS1 paling berguna s.d. ± hari 3</text>
<text x="32" y="496" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Parasetamol 10 mg/kgBB/dosis</text>
<text x="32" y="514" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">(jarak ≥ 6 jam, maks. 4 g/hari)</text>
<text x="32" y="532" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Hindari aspirin dan OAINS</text>
<rect x="304" y="400" width="300" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="316" y="422" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Fase kritis: waspada syok</text>
<text x="316" y="442" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Kebocoran plasma 24-48 jam</text>
<text x="316" y="460" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Ht naik ≥ 20%, efusi, asites,</text>
<text x="316" y="478" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">hipoalbuminemia</text>
<text x="316" y="496" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Tanda bahaya: muntah terus, nyeri</text>
<text x="316" y="514" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">perut hebat, letargi/gelisah, perdarahan,</text>
<text x="316" y="532" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">akral dingin, oliguria</text>
<rect x="618" y="400" width="262" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="630" y="422" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Fase pemulihan</text>
<text x="630" y="442" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Cairan kembali ke pembuluh</text>
<text x="630" y="460" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Ruam konvalesens ± 2-3 hari</text>
<text x="630" y="478" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">setelah bebas demam</text>
<text x="630" y="496" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Hentikan infus bila stabil;</text>
<text x="630" y="514" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">waspadai kelebihan cairan</text>
<text x="630" y="532" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">(sesak, edema paru)</text>
<text x="20" y="590" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Sumber: Kemenkes RI, PNPK Tata Laksana Infeksi Dengue pada Dewasa (KMK HK.01.07/MENKES/9845/2020); WHO Dengue fact sheet (2025).</text>
</svg>
