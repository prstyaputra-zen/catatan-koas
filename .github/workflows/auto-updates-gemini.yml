# Auto updates Catatan Koas oleh Gemini (2 kali sehari: 09.05 dan 21.05 WIB).
# Butuh secret repo GEMINI_API_KEY (Settings > Secrets and variables > Actions).
#
# Pengaman (disetujui Prasetya 16 Okt 2026):
# - Job "tulis": Gemini berjalan dengan izin repo hanya-baca dan tanpa kredensial git tersimpan.
#   Hasilnya (hanya feed/) diunggah sebagai artifact.
# - Job "terbitkan": mesin baru yang tidak pernah menjalankan Gemini. Ia mengambil checkout bersih,
#   memeriksa item dengan .github/scripts/terapkan-auto-update.py (item lama tidak berubah, sumber https,
#   tanpa skrip, gambar sesuai format), lalu baru meng-commit dengan identitas noreply.
name: Auto updates (Gemini)

on:
  schedule:
    - cron: '5 2,14 * * *' # UTC = 09.05 dan 21.05 WIB
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auto-updates
  cancel-in-progress: false

jobs:
  tulis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Mode headless: tanpa ini Gemini CLI menolak berjalan di folder yang belum "dipercaya".
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Gemini menulis satu item baru
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |-
            Kamu menjalankan rutin "Auto updates" untuk aplikasi Catatan Koas milik Prasetya (koas/dokter muda di Indonesia).
            Tulis dalam bahasa Indonesia. Baca dan ikuti persis file feed/PANDUAN-RUTIN.md di repo ini, dengan penyesuaian berikut:

            1. Pilih SATU topik baru sesuai giliran stase di panduan (jangan mengulang judul/tag yang sudah ada di feed/ilmu.json).
            2. Riset dengan google_web_search, lalu BUKA setiap sumber dengan web_fetch (atau curl). Setiap angka (dosis, batas, kriteria)
               harus berasal dari teks sumber yang benar-benar kamu buka, bukan dari ingatan. Utamakan PNPK/PPK Kemenkes, lalu WHO, NICE,
               AAFP, perhimpunan profesi, dan jurnal bereputasi. Dilarang: Wikipedia, blog, situs kesehatan populer.
            3. Tulis body sekitar 900-1.800 kata dengan urutan bagian wajib: Definisi, Anatomi dan fisiologi terkait (bila relevan),
               Patofisiologi (rantai sebab-akibat langkah demi langkah), Etiologi dan faktor risiko, Manifestasi klinis / Diagnosis,
               Tatalaksana (dosis dengan satuan dan rute, plus alasan farmakologis), Komplikasi / Kapan merujuk, Analogi,
               Mnemonik (tandai "(mnemonik buatan)" bila buatan sendiri), Poin untuk koas, Singkatan. Setiap singkatan ditulis
               kepanjangannya saat pertama muncul dan semuanya didaftar di bagian Singkatan.
            4. Gambar (bagian 3a panduan): utamakan gambar asli berlisensi terbuka (CC0, domain publik, CC BY, CC BY-SA) dari
               Wikimedia Commons. Cari lewat https://commons.wikimedia.org/w/api.php dengan header User-Agent
               "CatatanKoas/1.0 (https://github.com/prstyaputra-zen/catatan-koas)"; ambil lisensi dan penulis dari
               prop=imageinfo&iiprop=url|extmetadata; unduh thumbnail 1280px dari upload.wikimedia.org ke feed/img/<id>-N.jpg
               (bila dapat HTTP 429, tunggu sesuai retry-after lalu ulangi). Isi credit dengan penulis, lisensi, dan tautan halaman
               berkas. Bila tidak ada yang cocok, buat SVG sederhana sendiri di feed/img dengan credit "Digambar Gemini berdasarkan <sumber>".
            5. Tambahkan tepat SATU item di akhir array items di feed/ilmu.json (field id, created, title, type, stase, tags, body,
               images, guidelines, sources) dan perbarui field updated. Pertahankan format JSON (indentasi 1 spasi, UTF-8 asli).
            6. Hanya boleh mengubah feed/ilmu.json, feed/img/* dan feed/tools/spec/*. JANGAN menjalankan git commit atau git push;
               langkah berikutnya di workflow yang melakukannya (kamu juga tidak punya izin push).
            7. Bila tidak ada sumber layak yang berhasil dibuka dan diverifikasi, jangan ubah file apa pun.

      - name: Unggah hasil (hanya folder feed)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-gemini
          path: feed/
          retention-days: 3
          if-no-files-found: error

  terbitkan:
    needs: tulis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ambil hasil Gemini
        uses: actions/download-artifact@v4
        with:
          name: hasil-gemini
          path: ${{ runner.temp }}/hasil/feed

      - name: Periksa dan terapkan item baru
        run: python3 .github/scripts/terapkan-auto-update.py "$RUNNER_TEMP/hasil" .

      - name: Commit dan push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then echo "Tidak ada item baru."; exit 0; fi
          TITLE=$(python3 -c "import json;print(json.load(open('feed/ilmu.json'))['items'][-1]['title'])")
          git config user.name "Prasetya"
          git config user.email "337586035+prstyaputra-zen@users.noreply.github.com"
          git add feed/ilmu.json feed/img feed/tools/spec
          git commit -m "Auto updates: $TITLE" -m "Ditulis oleh Gemini lewat GitHub Actions."
          git push origin HEAD:main
